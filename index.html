/* =====================================================================
   TON: selbst erzeugte Klänge und Musik (Web Audio, keine Dateien, kein Internet)
   - Zwei getrennte Kanäle: Klänge (sfx) und Musik, beide einzeln abschaltbar.
   - Musik in zwei Stimmungen: ruhig (Karte, Hauptquartier, Geschichten)
     und flott (Rätsel). Wechsel mit sanfter Überblendung.
   - Damit nichts nervt: leise Grundlautstärke, Variation, Pausentakte,
     und nach längerer Spielzeit wird die Musik automatisch noch leiser.
   iOS: Der Ton darf erst nach dem ersten Tippen starten (unlock),
   Musik pausiert, wenn die Seite in den Hintergrund geht.
   ===================================================================== */
const Sound = {
  ctx: null, master: null, sfx: null, mus: null,
  get on(){ return !App.p || App.p.settings.sound !== false; },
  get musicOn(){ return !App.p || App.p.settings.music !== false; },
  unlock(){
    if (!this.on && !this.musicOn) return;
    try {
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        const c = this.ctx = new AC();
        this.master = c.createGain(); this.master.gain.value = 1; this.master.connect(c.destination);
        this.sfx = c.createGain(); this.sfx.gain.value = 1; this.sfx.connect(this.master);
        this.mus = c.createGain(); this.mus.gain.value = 0; this.mus.connect(this.master);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e){}
  },
  ready(){ return this.ctx && this.ctx.state === 'running'; },
  tone(freq, dur = .12, type = 'sine', vol = .12, when = 0, slide = 0, att = .012, bus = 'sfx'){
    if (!this.ready() || (bus === 'sfx' ? !this.on : !this.musicOn)) return;
    const c = this.ctx, t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g).connect(bus === 'sfx' ? this.sfx : this.mus); o.start(t); o.stop(t + dur + .05);

const Music = {
  mode: null, n: 0, playedMs: 0, lastT: 0,
  VOL: { calm: .8, action: .7 },
  set(m){
    if (m === this.mode) return;
    this.mode = m; this.n = 0;
    this.fadeTo(m ? this.level() : 0, m ? 1.2 : .5, .35);
  },
  /* Nach 20 Minuten Musik wird sie automatisch leiser */
  level(){ const base = this.VOL[this.mode] || .5; return this.playedMs > 20 * 60e3 ? base * .6 : base; },
  fadeTo(v, secs = .8, dip = 0){
    const S = Sound; if (!S.ready() || !S.mus) return;
    const g = S.mus.gain, t = S.ctx.currentTime;

    if (dip){ g.linearRampToValueAtTime(0, t + dip); g.linearRampToValueAtTime(v, t + dip + secs); }

  },

    if (Sound.mus.gain.value < .01 && this.n === 0) this.fadeTo(this.level(), 1.2);
    this.playedMs += dt;
    const n = this.n++, T = (f, d, ty, v, a) => Sound.tone(f, d, ty, v, 0, 0, a, 'mus');
    if (this.mode === 'calm'){

      const chords = [[262, 330, 392], [220, 262, 330], [175, 220, 262], [196, 247, 294]], ch = chords[bar % 4];
      if (st === 0) ch.forEach((f, i) => T(f, 5.2, 'sine', .009, 1.2 + i * .1));
      if (st === 0 && bar % 2 === 0) T(ch[0] / 2, 4, 'sine', .012, .8);
      const rest = bar === 7;                                  // jeder 8. Takt: nur Klangteppich
      if (!rest && st % 4 === 0 && Math.random() < (bar % 4 === 3 ? .35 : .55)){
        const pool = [...ch.map(f => f * 2), 587, 659, 784, 880], f = pool[Math.floor(Math.random() * pool.length)];
        T(f, 1.4, 'sine', .016, .02); T(f * 2, .6, 'triangle', .003, .02);
      }
    } else if (this.mode === 'action'){
      // 16 Schritte je Takt; 8-Takt-Lied mit Refrain und Atempause
      const bar = Math.floor(n / 16) % 16, st = n % 16;
      const roots = [131, 110, 87, 98], chords = [[523, 659, 784], [440, 523, 659], [349, 440, 523], [392, 494, 587]];
      const r = bar % 4, calmBar = bar === 7 || bar === 15;
      const tired = this.playedMs > 8 * 60e3 && (bar % 2 === 1);   // nach 8 Minuten etwas ausgedünnt
      if (calmBar){ if (st === 0) chords[r].forEach(f => T(f / 2, 1.8, 'sine', .01, .3)); return; }
      if ([0, 6, 10].includes(st)) T(roots[r], .2, 'triangle', .042, .005);
      if (!tired && st % 2 === 0) T(chords[r][(st / 2) % 3] * (st >= 8 ? 2 : 1), .11, 'triangle', .012, .005);
      if (bar >= 8 && [0, 3, 6, 8].includes(st)) T([784, 880, 988, 1047][[0, 3, 6, 8].indexOf(st)] * (r === 2 ? .89 : 1), .22, 'sine', .014, .01);   // kleine Melodie im zweiten Teil
      if (st % 4 === 2) T(5200, .025, 'sine', .004, .002);
    }
  }
};

const FXPAL = { cols: ['#FF4FB8', '#4EE8FF', '#FFD66B', '#FFFFFF', '#B06BFF'], shapes: ['star', 'star', 'heart'] };

  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); x.translate(32, 32);
  if (shape === 'glow'){ const g = x.createRadialGradient(0, 0, 0, 0, 0, 32); g.addColorStop(0, col); g.addColorStop(.25, col + 'CC'); g.addColorStop(1, col + '00'); x.fillStyle = g; x.fillRect(-32, -32, 64, 64); }

const FX = {
  c: null, x: null, p: [], W: 1180, H: 820, mode: 'glitter',
  attach(canvas){ this.c = canvas; this.x = canvas.getContext('2d'); },
  resize(W, H, k){ this.W = W; this.H = H; this.c.width = Math.round(W * k); this.c.height = Math.round(H * k); this.c.style.width = W + 'px'; this.c.style.height = H + 'px'; this.x.setTransform(k, 0, 0, k, 0, 0); },
  ambient(mode){ // 'glitter' (Stadt), 'dust' (gemütlich), 'none'

    for (let i = 0; i < n; i++) this.p.push(this.amb(true));
  },
  amb(init){
    const r = Math.random, W = this.W, H = this.H;

    if (this.mode === 'dust') return { ...b, y: r() * H, vx: 2 + r() * 5, vy: (r() - .5) * 5, size: 10 + r() * 16, spr: sprite('glow', '#FFD6A0'), a: .45 };

      this.p.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120 * power, g: 520, drag: 2.2, size: 16 + r() * 18, rot: r() * 6, vr: (r() - .5) * 8, life: 0, max: .6 + r() * .6, spr: sprite(FXPAL.shapes[k % 3], FXPAL.cols[k % 5]), a: 1 }); }

  },
  confetti(n = 70){
    for (let k = 0; k < (RM ? 8 : n); k++){ const r = Math.random;
      this.p.push({ x: this.W * (.1 + r() * .8), y: -20 - r() * 220, vx: (r() - .5) * 120, vy: 80 + r() * 160, g: 90, drag: .3, size: 18 + r() * 16, rot: r() * 6, vr: (r() - .5) * 7, life: 0, max: 3 + r() * 1.5, spr: sprite(FXPAL.shapes[k % 3], FXPAL.cols[k % 5]), a: 1 }); }

    else x.drawImage(q.spr, q.x - s / 2, q.y - s / 2, s, s);

};

/* =====================================================================
   SPEICHERSTAND (lokal im Browser, mit Ersatz im Arbeitsspeicher)
   Profile für mehrere Kinder, Sicherungscode zum Exportieren/Importieren.
   ===================================================================== */
const STORE_KEY = 'zauberdetektei.v1';
const Store = {
  mem: null, ok: true,
  load(){
    try { const s = localStorage.getItem(STORE_KEY); if (s) return (this.mem = JSON.parse(s)); } catch (e){ this.ok = false; }
    return this.mem;
  },
  save(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.mem)); this.ok = true; } catch (e){ this.ok = false; }
  },
  init(){
    if (!this.load() || !this.mem.profiles){ this.mem = { v: 1, active: null, profiles: {} }; }
    if (!this.mem.active || !this.mem.profiles[this.mem.active]){ const p = newProfile('Sternchen'); this.mem.profiles[p.id] = p; this.mem.active = p.id; this.save(); }
    this.migrate();
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e){}
    return this.profile();
  },
  /* Ältere oder importierte Spielstände auf den aktuellen Stand bringen (fehlende Felder ergänzen) */
  migrate(){
    for (const q of Object.values(this.mem.profiles)){
      const d = newProfile(q.name || 'Sternchen');
      for (const key of Object.keys(d)) if (q[key] == null) q[key] = d[key];
      q.settings = Object.assign({ sound: true, music: true, k4: {}, level: 1 }, q.settings); q.settings.k4 = q.settings.k4 || {};
      q.look = Object.assign({ hair: 0, skin: 0, outfit: 0, hat: 0 }, q.look);
      Report.ensure(q);
      // Aufnahmeprüfung wurde früher nicht je Thema gezählt: jedes geprüfte Thema kam genau einmal vor
      if (q.placementDone && !q.m2){ for (const [id] of PLACEMENT){ const k = q.skills[id]; if (k && k.pn == null) k.pn = 1; } }
      q.m2 = true;
    }
  },
  profile(){ return this.mem.profiles[this.mem.active]; },
  /* Sicherungscode: Text zum Kopieren und Einfügen */
  exportCode(){ const json = JSON.stringify(this.mem); return 'ZD1-' + btoa(unescape(encodeURIComponent(json))); },
  importCode(code){
    let c = String(code || '').trim();
    // Auch eine gesicherte Datei ist erlaubt: { "app": "zauberdetektei", "code": "ZD1-…" }
    if (c.startsWith('{')){ try { c = JSON.parse(c).code || ''; } catch (e){ throw new Error('Diese Datei ist keine Sicherung der Zauber-Detektei.'); } }
    c = String(c).replace(/\s+/g, '');
    if (!c.startsWith('ZD1-')) throw new Error('Das ist kein Sicherungscode der Zauber-Detektei.');
    let data;
    try { data = JSON.parse(decodeURIComponent(escape(atob(c.slice(4))))); } catch (e){ throw new Error('Der Sicherungscode ist beschädigt oder unvollständig.'); }
    if (!data || !data.profiles || !data.active || !data.profiles[data.active]) throw new Error('Der Sicherungscode ist unvollständig.');
    this.mem = data; this.migrate(); this.save(); return true;
  },
  /* Sicherung als Datei (landet auf dem iPad in der Dateien-App unter „Downloads“) */
  exportFile(){ return JSON.stringify({ app: 'zauberdetektei', v: 1, date: new Date().toISOString(), code: this.exportCode() }, null, 1); }
};

    name, created: Date.now(),

/* ===== 61-model.js ===== */
/* =====================================================================
   LERNMODELL
   - Beherrschungswert m (0 … 1) pro Teilkompetenz, gleitender Mittelwert
     mit Gewichtung nach Schwierigkeit
   - Aufgabenauswahl im Flow-Bereich (Ziel ~75 % Erfolg), gelegentlich
     leichtere Erfolgsaufgaben und etwas schwerere Herausforderungen
   - Wiederholung mit Abstand (fällige Kompetenzen bekommen Vorrang)
   - Klasse-4-Inhalte erst nach Freischaltung (automatisch oder Elternbereich)
   ===================================================================== */
const Model = {
  sk(p, id){ return p.skills[id] || (p.skills[id] = { m: .3, n: 0, ok: 0, last: 0, due: 0, err: {}, ms: 0 }); },
  mastery(p, id){ return p.skills[id] ? p.skills[id].m : .3; },
  /* Ist eine Kompetenz gerade im Spiel? */
  available(p, id){
    const S = SKILL[id]; if (!S) return false;
    const mode = (p.settings.k4 || {})[id] || 'auto';
    if (S.off && mode !== 'on') return false;
    if (S.cat !== 'k4') return mode !== 'off';
    if (mode === 'on') return true;
    if (mode === 'off') return false;
    return S.pre.every(q => this.mastery(p, q) >= (S.gate || .7));
  },
  /* Schwierigkeit passend zum Lernstand; manchmal leichter oder schwerer */
  pickDiff(m, p){
    const lv = p && p.settings ? (p.settings.level ?? 1) : 1;
    const mm = m + (LEVELS[lv] || LEVELS[1]).add;
    let d = mm < .38 ? 1 : mm < .64 ? 2 : 3;
    const r = Math.random();
    if (r < .1) d = Math.max(1, d - 1); else if (r > .78) d = Math.min(3, d + 1);   // öfter eine Herausforderung
    return d;
  },
  /* Wahrscheinlichkeit, die Aufgabe zu schaffen (für die Flow-Steuerung) */
  successChance(m, d){ return clamp(.55 + (m - [.15, .45, .75][d - 1]) * 1.1, .05, .98); },
  next(p, opt = {}){
    const now = Date.now();
    const av = SKILLS.filter(s => this.available(p, s.id) && (!opt.only || opt.only.includes(s.id)));
    if (!av.length) return { skill: 'm_kern', diff: 1 };
    // Kategorie nach Anteilen wählen (50/30/20), nur unter verfügbaren
    const cats = [...new Set(av.map(s => s.cat))];
    const tot = cats.reduce((a, c) => a + CATS[c].share, 0);
    let r = Math.random() * tot, cat = cats[0];
    for (const c of cats){ r -= CATS[c].share; if (r <= 0){ cat = c; break; } }
    const inCat = av.filter(s => s.cat === cat);
    const last = p.lastSkills || [];
    const weights = inCat.map(s => {
      const k = this.sk(p, s.id);
      let w = 1.15 - k.m;                                  // Schwächeres öfter
      if (k.due && now >= k.due) w += .45;                  // fällige Wiederholung
      if (k.n === 0) w += .25;                              // Neues ausprobieren
      const preMin = s.pre.length ? Math.min(...s.pre.map(q => this.mastery(p, q))) : 1;
      if (preMin < .35 && k.n < 3) w *= .3;                 // erst die Grundlagen
      if (last[0] === s.id && last[1] === s.id) w = 0;      // nicht 3x hintereinander
      else if (last[0] === s.id) w *= .5;
      if (s.cat === 'k4' && k.n < 5) w *= .6;               // Neues behutsam einstreuen
      return Math.max(0, w);
    });
    const sum = weights.reduce((a, b) => a + b, 0) || 1;
    let x = Math.random() * sum, pick = inCat[0];
    for (let i = 0; i < inCat.length; i++){ x -= weights[i]; if (x <= 0){ pick = inCat[i]; break; } }
    const d = this.pickDiff(this.mastery(p, pick.id), p);
    return { skill: pick.id, diff: Math.min(3, d + (opt.bump || 0)) };
  },
  /* Ergebnis eintragen. score: 1 = sofort richtig … 0 = Lösung angesehen */
  record(p, task, res){
    const k = this.sk(p, task.skill), now = Date.now();
    const target = res.score, dw = [.75, 1, 1.25][task.diff - 1];
    let a = .22 * dw;
    if (res.score >= 1 && (res.ms || 0) < 25000) a *= 1.3;                   // schnell und sicher: schneller aufsteigen
    if (target < k.m && task.diff > (k.m < .42 ? 1 : k.m < .74 ? 2 : 3)) a *= .5;  // schwere Aufgabe nicht geschafft: milder
    if (target > k.m && task.diff < (k.m < .42 ? 1 : k.m < .74 ? 2 : 3)) a *= .5;  // leichte geschafft: wenig Zuwachs
    k.m = clamp(k.m + a * (target - k.m), 0, 1);
    k.n++; if (res.score >= 1) k.ok++;
    k.streak = res.score >= 1 ? (k.streak || 0) + 1 : 0;
    if (k.streak >= 3){ k.m = clamp(k.m + .06, 0, 1); k.streak = 0; }          // drei in Folge: eine Stufe näher an „schwer“
    if (res.pattern) k.err[res.pattern] = (k.err[res.pattern] || 0) + 1;
    k.last = now; k.ms += Math.min(MAX_TASK_MS, res.ms || 0);
    const H = 3600e3, D = 24 * H;
    k.due = now + (k.m < .45 ? .15 * H : k.m < .65 ? 1 * D : k.m < .85 ? 3 * D : 7 * D);
    p.lastSkills = [task.skill, ...(p.lastSkills || [])].slice(0, 4);
    p.recent = [task.key, ...(p.recent || [])].slice(0, 40);
    Report.add(p, res);
  },
  newTask(p, opt){ const pick = this.next(p, opt); return generate(pick.skill, pick.diff, p.recent); },
  /* Empfehlung für den Elternbereich */
  recommend(p){
    const av = SKILLS.filter(s => this.available(p, s.id) && s.cat !== 'k4');
    const weak = av.map(s => ({ s, m: this.mastery(p, s.id) })).filter(x => x.m < .65).sort((a, b) => a.m - b.m);
    return weak.slice(0, 2).map(x => x.s);
  }
};

/* ---------- Aufnahmeprüfung: erst leicht, dann schwerer ---------- */
const PLACEMENT = [['m_kern', 1], ['z_stellen', 1], ['m_reihe_346', 1], ['as_kopf', 1], ['d_kern', 2], ['m_reihe_789', 2], ['m_platz', 2], ['z_ordnen', 2], ['m_zehner', 2], ['d_rest', 2]];

/* ===== 62-report.js ===== */
/* =====================================================================
   AUSWERTUNG FÜR DEN ELTERNBEREICH (reine Rechenfunktionen, automatisch getestet)
   Wichtig: Es wird streng unterschieden zwischen
   - noch nicht geübt  (nur ein geschätzter Startwert, KEIN Messwert)
   - nur Aufnahmeprüfung (1–2 Aufgaben, vorläufig)
   - wenige Übungen (1–4 Aufgaben, vorläufig)
   - gemessen (ab 5 Aufgaben)
   ===================================================================== */
const MIN_RELIABLE = 5;                 // ab so vielen Aufgaben gilt ein Wert als belastbar
const MAX_TASK_MS = 5 * 60 * 1000;      // eine Aufgabe zählt höchstens 5 Minuten (falls das iPad offen liegen bleibt)
const PATTERN_TIPS = {
  plus_statt_mal: 'Mal-Aufgaben als „so oft wie“ legen oder malen (3 · 4 = 3 Reihen mit je 4).',
  mal_statt_geteilt: 'Geteilt als Umkehraufgabe üben: 56 : 7 heißt „wie oft passt die 7 in 56?“.',
  nachbar: 'Die schwierigen Reihen (6, 7, 8, 9) mit Kernaufgaben ableiten: 7 · 8 = 5 · 8 + 2 · 8.',
  dreher: 'Zahlen laut vorlesen lassen und beim Schreiben mit dem Zehner beginnen.',
  null: 'Mit Zehnerzahlen rechnen wie mit Einern: 3 · 4 Zehner = 12 Zehner = 120.',
  rest_gross: 'Beim Teilen mit Rest prüfen: Der Rest muss kleiner sein als der Teiler.',
  rest_vergessen: 'Nach dem Teilen immer fragen: Bleibt etwas übrig?',
  aufrunden: 'Bei Sachaufgaben fragen: Brauche ich für den Rest noch eine Kiste mehr?',
  uebertrag: 'Den Übertrag klein aufschreiben, bevor die nächste Stelle gerechnet wird.',
  stellenwert: 'Mit der Stellenwerttafel arbeiten: Leere Stellen bekommen eine Null.',
  um_eins: 'Zählstriche oder Nachbarzahlen gemeinsam überprüfen.',
  einheit: 'Umrechnungen wiederholen: 1 € = 100 ct, 1 m = 100 cm, 1 h = 60 min, 1 kg = 1000 g.',
  richtung: 'Merkhilfe: Die offene Seite des Zeichens zeigt zur größeren Zahl.'
};

const Report = {
  /* Datum in Ortszeit (nicht UTC), damit Tage um Mitternacht wechseln */
  day(ts = Date.now()){ const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; },
  ensure(p){
    p.stats = p.stats || { tasks: 0, firstTry: 0, ms: 0, days: {} };
    if (!p.stats.log){
      // Frühere Spielstände: Es wurden nur Minuten je Tag gespeichert (in UTC). Die übernehmen wir als „nur Zeit“.
      p.stats.log = {};
      for (const [d, ms] of Object.entries(p.stats.days || {})) p.stats.log[d] = { ms, n: 0, ok: 0, old: true };
    }
    p.stats.cases = p.stats.cases || [];
    return p.stats;
  },
  /* Eine bearbeitete Aufgabe verbuchen (Training, Fälle und Aufnahmeprüfung) */
  add(p, res, ts = Date.now()){
    const S = this.ensure(p), ms = Math.min(MAX_TASK_MS, Math.max(0, res.ms || 0)), ok = res.score >= 1 ? 1 : 0;
    S.tasks++; S.firstTry += ok; S.ms += ms;
    const d = this.day(ts), L = S.log[d] || (S.log[d] = { ms: 0, n: 0, ok: 0 });
    L.ms += ms; L.n++; L.ok += ok;
    S.days[d] = (S.days[d] || 0) + ms;
  },
  caseSolved(p, id, stars, ts = Date.now()){ this.ensure(p).cases.push({ id, stars, d: this.day(ts) }); },
  /* Zustand einer Kompetenz für die Anzeige */
  skill(p, id){
    const k = p.skills[id], n = k ? k.n : 0, pn = k ? (k.pn || 0) : 0;
    const base = { id, n, pn, total: n + pn, m: k ? k.m : null, first: n ? Math.round(k.ok / n * 100) : null };
    base.errs = k ? Object.entries(k.err || {}).sort((a, b) => b[1] - a[1]).slice(0, 2) : [];
    if (n === 0 && !pn){ base.state = 'none'; base.label = 'noch nicht geübt'; base.pct = null; return base; }
    const pct = Math.round(k.m * 100);
    base.pct = pct;
    base.level = k.m >= .7 ? 'good' : k.m >= .45 ? 'mid' : 'low';
    base.word = { good: 'sicher', mid: 'übt noch', low: 'Schwerpunkt' }[base.level];
    base.enough = n >= 3;   // erst ab 3 eigenen Aufgaben wird farbig eingestuft
    if (n === 0){ base.state = 'test'; base.label = `vorläufig · nur Aufnahmeprüfung (${pn} ${pn === 1 ? 'Aufgabe' : 'Aufgaben'})`; return base; }
    if (n < MIN_RELIABLE){ base.state = 'few'; base.label = `vorläufig · erst ${n} ${n === 1 ? 'Aufgabe' : 'Aufgaben'}`; return base; }
    base.state = 'ok'; base.label = `${n} Aufgaben · ${base.first} % sofort richtig`; return base;
  },
  /* Die letzten 7 Tage (heute eingeschlossen) */
  week(p, now = Date.now()){
    const S = this.ensure(p), names = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'], days = [];
    for (let i = 6; i >= 0; i--){
      const t = now - i * 864e5, d = this.day(t), L = S.log[d] || { ms: 0, n: 0, ok: 0 };
      days.push({ d, label: names[new Date(t).getDay()], today: i === 0, min: Math.round(L.ms / 60000), n: L.n, ok: L.ok, old: !!L.old });
    }
    const n = days.reduce((a, x) => a + x.n, 0), ok = days.reduce((a, x) => a + x.ok, 0), min = days.reduce((a, x) => a + x.min, 0);
    const since = days[0].d, cases = S.cases.filter(c => c.d >= since).length;
    return { days, n, ok, min, rate: n ? Math.round(ok / n * 100) : null, active: days.filter(x => x.min > 0 || x.n > 0).length, cases, hasOld: days.some(x => x.old) };
  },
  /* Häufigste Fehlermuster über alle Kompetenzen */
  patterns(p){
    const sum = {};
    for (const k of Object.values(p.skills)) for (const [e, c] of Object.entries(k.err || {})) sum[e] = (sum[e] || 0) + c;
    return Object.entries(sum).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([e, c]) => ({ e, c, name: PATTERNS[e] || e, tip: PATTERN_TIPS[e] || '' }));
  },
  /* Empfehlung: zuerst gemessene Schwächen, dann Themen aus der Aufnahmeprüfung, dann Neues */
  recommend(p){
    const av = SKILLS.filter(s => Model.available(p, s.id));
    const info = av.map(s => ({ s, r: this.skill(p, s.id) }));
    // Nur echte Hinweise auf Unsicherheit: gemessen schwach, oder bei wenigen Aufgaben mehrheitlich nicht sofort richtig
    const weak = info.filter(x => (x.r.state === 'ok' && x.r.m < .6) || (x.r.state === 'few' && x.r.n >= 3 && x.r.first < 60))
      .sort((a, b) => (a.r.state === 'ok' ? a.r.m : a.r.first / 100) - (b.r.state === 'ok' ? b.r.m : b.r.first / 100))
      .map(x => ({ s: x.s, why: x.r.state === 'ok' ? `${x.r.pct} % Beherrschung nach ${x.r.n} Aufgaben` : `von den ersten ${x.r.n} Aufgaben ${x.r.first} % sofort richtig` }));
    const tested = info.filter(x => { const k = p.skills[x.s.id]; return x.r.state === 'test' && k && (k.pok || 0) < k.pn; }).map(x => ({ s: x.s, why: 'in der Aufnahmeprüfung noch nicht geschafft' }));
    const fresh = info.filter(x => x.r.state === 'none' && x.s.pre.every(q => Model.mastery(p, q) >= .5)).map(x => ({ s: x.s, why: 'neu, die Voraussetzungen sitzen' }));
    return [...weak, ...tested, ...fresh].slice(0, 3);
  },
  /* Gesamtüberblick seit Beginn */
  overall(p){
    const S = this.ensure(p), practiced = SKILLS.filter(s => (p.skills[s.id] || {}).n > 0).length;
    const secure = SKILLS.filter(s => { const r = this.skill(p, s.id); return r.state === 'ok' && r.level === 'good'; }).length;
    const solved = CASES.filter(c => (p.cases[c.id] || {}).status === 'done').length;
    return { tasks: S.tasks, rate: S.tasks ? Math.round(S.firstTry / S.tasks * 100) : 0, min: Math.round(S.ms / 60000), practiced, secure, total: SKILLS.length, solved, cases: CASES.length };
  }
};

  d += ` L${lx.toFixed(0)} ${ly.toFixed(0)}`;

function TaskScreen(session){
  let st;
  const fresh = tk => ({ task: tk, inp: {}, focus: null, wrongs: 0, help: 0, solved: false, gave: false, t0: Date.now(), pattern: null, similarUsed: false,
    dealt: tk.kind === 'deal' ? Array(tk.q.groups).fill(0) : null, linePos: tk.kind === 'line' ? tk.q.min + Math.round((tk.q.max - tk.q.min) * .12 / tk.q.snap) * tk.q.snap : null,
    wr: tk.kind === 'written' ? { d: Array(tk.q.w).fill(''), c: Array(tk.q.w).fill(0), focus: tk.q.w - 1, right: false } : null,
    msg: { text: session.kind === 'placement' && session.index === 0 ? 'Das erste Schloss! Ganz entspannt.' : RND.pick(STARTLINE), expr: 'normal' } });
  const newTask = () => { st = fresh(session.make(session.index)); const s = st.task.parts && st.task.parts.find(p => p.slot); st.focus = s ? s.slot : null; };
  newTask();

  /* ----- Hilfsfunktionen ----- */
  const T = () => st.task;
  const slots = () => (T().parts || []).filter(p => p.slot && !(T().kind === 'choice')).map(p => p.slot);
  const isChoice = () => T().kind === 'choice' || (T().kind === 'shape' && ['nameBody', 'symmetry', 'pickBody'].includes(T().q.mode));
  const usesKeypad = () => !isChoice() && !(T().kind === 'line' && T().q.mode === 'place');
  function slotHTML(p){
    const v = st.inp[p.slot];
    const right = st.solved || st.gave || (st.rightSlots && st.rightSlots.includes(p.slot));
    return `<span class="slot ${p.w === 2 ? 'w2' : ''} ${v ? 'filled' : ''} ${st.focus === p.slot && !st.solved && !isChoice() ? 'focus' : ''} ${right ? 'right' : ''} ${T().kind === 'choice' ? 'opt-slot' : ''}" data-slot="${p.slot}">${v != null && v !== '' ? (T().kind === 'choice' ? v : fmt(+v)) : (st.focus === p.slot && !isChoice() ? '<span class="caret"></span>' : '')}</span>`;
  }
  function eqHTML(){
    const parts = T().parts || []; if (!parts.length) return '';
    const segs = [[]]; parts.forEach(p => p.br ? segs.push([]) : segs[segs.length - 1].push(p));
    const len = Math.max(...segs.map(sg => sg.reduce((a, p) => a + (p.slot ? (p.w === 2 ? 7 : 3) : ((p.t || '').length + 1) * (/[a-zäöüß€]/i.test(p.t || '') && !p.word ? .6 : 1)), 0)));
    const lines = segs.length, wordy = parts.some(p => p.word);
    const withVisual = !['eq', 'choice'].includes(T().kind);
    const size = lines >= 4 || len > 24 ? 'tiny' : lines >= 2 || len > 14 || wordy || withVisual ? 'small' : '';
    return `<div class="eq ${size}">${parts.map(p => {
      if (p.br) return '<span class="ln"></span>';
      if (p.slot) return slotHTML(p);
      if (p.word) return `<span class="word">${p.t}</span>`;
      return /[a-zäöüßA-ZÄÖÜ€]/.test(p.t) && !/^R$/.test(p.t) ? `<span class="unit">${p.t}</span>` : `<span>${p.t}</span>`;
    }).join('')}</div>`;
  }
  function kindHTML(){
    const tk = T(), q = tk.q, h3 = st.help >= 3 || st.gave;
    if (tk.kind === 'deal'){
      const left = q.total - st.dealt.reduce((a, b) => a + b, 0);
      return `<div class="deal ${q.groups > 5 ? 'many' : ''}"><div class="pile">${gem(38)}<span>${left} übrig</span></div><div class="plates">${st.dealt.map((c, i) => `<button class="plate" data-plate="${i}" aria-label="${q.box} ${i + 1}">${Draw.plateSVG()}<span class="on">${Array.from({ length: Math.min(c, 12) }, () => '<i></i>').join('')}</span></button>`).join('')}</div></div>`;
    }
    if (tk.kind === 'pv') return Draw.pv(q.cols, q.digits);
    if (tk.kind === 'wall') return `<div class="wall">${q.rows.map(r => `<div class="wrow">${r.map(b => `<span class="brick">${b.s ? slotHTML({ slot: b.s }) : `<b>${fmt(b.v)}</b>`}</span>`).join('')}</div>`).join('')}</div>`;
    if (tk.kind === 'chart') return `<div class="chartbox" style="${App.port ? 'height:210px' : 'height:215px;width:430px;flex:0 0 430px'}">${Draw.chart(q, h3)}</div>`;
    if (tk.kind === 'line'){ const ans = st.gave ? q.value : null;
      return Draw.line(q, { labels: h3 ? 'all' : 'major', arrow: q.mode === 'read' ? q.value : ans, lupe: q.mode === 'place' ? (st.gave ? q.value : st.linePos) : null }); }
    if (tk.kind === 'shape'){
      if (q.mode === 'pickBody') return `<div class="bodies">${q.options.map(o => `<button class="opt ${st.inp.c === o.v ? (st.solved ? 'right' : 'sel') : ''}" data-choice="${o.v}" aria-label="Körper">${Draw.body(o.body)}</button>`).join('')}</div>`;
      if (q.mode === 'nameBody') return `<div class="shapewrap">${Draw.body(q.body)}</div>`;
      if (q.mode === 'symmetry') return `<div class="shapewrap">${Draw.symmetry(q.grid)}</div>`;
      return `<div class="shapewrap" style="height:230px">${Draw.gridRect(q.w, q.h, q.mode, h3)}</div>`;
    }
    if (tk.kind === 'written'){
      const w = q.w, A = String(q.a).padStart(w, ' '), B = String(q.b).padStart(w, ' '), small = w > 4;
      const cells = (s) => s.split('').map(d => `<td class="d">${d.trim()}</td>`).join('');
      const carry = q.op === '+' ? `<tr class="carry"><td class="op"></td>${st.wr.c.map((c, i) => `<td class="c ${c ? 'on' : ''}" data-carry="${i}">${c ? 1 : ''}</td>`).join('')}</tr>` : '';
      const res = st.wr.d.map((d, i) => `<td class="r ${st.wr.focus === i && !st.solved ? 'focus' : ''} ${st.solved || st.gave ? 'right' : ''}" data-cell="${i}">${d}</td>`).join('');
      return `<table class="wr ${small ? 'small' : ''}"><tr class="num"><td class="op"></td>${cells(A)}</tr><tr class="num"><td class="op">${q.op === '+' ? '+' : '−'}</td>${cells(B)}</tr>${carry}<tr class="line"><td class="op"></td>${Array.from({ length: w }, () => '<td></td>').join('')}</tr><tr class="res"><td class="op"></td>${res}</tr></table>`;
    }
    return '';
  }
  function workHTML(){
    const tk = T(); let h = '';
    const showViz = st.help >= 3 && !st.gave && !['deal', 'line', 'chart', 'shape', 'written'].includes(tk.kind) && tk.viz;
    if (tk.kind === 'wall'){ h = kindHTML(); if (showViz) h = `<div class="wv">${h}<div class="viz fade-in">${Draw.viz(tk.viz)}</div></div>`; if (st.gave) h = `<div class="wv">${h}<div class="sol fade-in">${tk.solution.map(l => `<div>${l}</div>`).join('')}</div></div>`; return h; }
    if (tk.kind !== 'eq' && tk.kind !== 'choice' && !(st.gave && tk.kind === 'deal')) h += kindHTML();
    if (tk.kind === 'eq' || tk.kind === 'choice' || ['deal', 'pv', 'chart'].includes(tk.kind) || (tk.kind === 'line' && tk.q.mode === 'read') || (tk.kind === 'shape' && ['area', 'perimeter'].includes(tk.q.mode))) h += eqHTML();
    if (showViz) h = `<div class="wv">${h}<div class="viz fade-in">${Draw.viz(tk.viz)}</div></div>`;
    if (tk.kind === 'chart' && !App.port) h = `<div class="wv" style="flex-wrap:nowrap;gap:18px">${h}</div>`;
    if (tk.kind === 'written' && st.help >= 3 && !st.gave) h += '';
    if (st.gave) h += `<div class="sol fade-in">${tk.solution.map(l => `<div>${l}</div>`).join('')}</div>`;
    return h;
  }
  function inputHTML(port){
    const tk = T();
    if (st.solved || (st.gave && session.allowSolution)){
      const sim = st.gave && !st.similarUsed;
      return `<div class="opts" style="justify-content:center">${sim ? `<button class="btn wide" data-act="similar">${icon('plus')}Ähnliche Aufgabe</button><button class="btn sec wide" data-act="next">Weiter${icon('weiter')}</button>` : `<button class="btn big wide" data-act="next">Weiter${icon('weiter')}</button>`}</div>`;
    }
    if (isChoice()){
      const opts = tk.kind === 'choice' ? tk.q.options : tk.q.mode === 'pickBody' ? [] : tk.q.options;
      if (!opts.length) return `<div class="opts" style="justify-content:center;text-align:center;font-size:21px;font-weight:700;color:var(--ink-soft)">Tippe auf den richtigen Körper.</div>`;
      return `<div class="opts ${port ? 'row' : ''}">${opts.map(o => `<button class="opt ${st.inp.c === o.v ? 'sel' : ''}" data-choice="${o.v}">${o.label && o.label.length <= 2 ? `<span class="big">${o.label}</span>${o.sub ? `<small>${o.sub}</small>` : ''}` : o.label}</button>`).join('')}</div>`;
    }
    if (tk.kind === 'line' && tk.q.mode === 'place') return `<div class="opts" style="justify-content:center"><p style="margin:0;font-size:20px;font-weight:700;text-align:center;color:var(--ink-soft)">Zieh die Lupe auf die richtige Stelle.</p><button class="btn big wide mint" data-act="check">${icon('check')}Prüfen</button></div>`;
    if (!port) return `<div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')}<button class="key del" data-k="del" aria-label="Löschen">${icon('loeschen')}</button><button class="key" data-k="0">0</button><button class="key ok" data-k="ok" aria-label="Prüfen">${icon('check')}</button></div>`;
    return `<div class="keypad k5">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')}<button class="key del span2" data-k="del" aria-label="Löschen">${icon('loeschen')}</button><button class="key ok span3" data-k="ok" aria-label="Prüfen">${icon('check')}</button></div>`;
  }
  const maxHelp = () => session.allowSolution ? 4 : 3;
  function helpBtnHTML(port){
    if (st.solved || (st.gave && session.allowSolution)) return '';
    return `<div style="display:flex;gap:14px;align-items:center;${port ? '' : 'flex-direction:column;align-items:stretch'}"><button class="btn mint ${port ? '' : 'wide'}" data-act="help" ${st.help >= maxHelp() ? 'disabled' : ''} style="${port ? 'flex:0 0 250px' : ''}">${icon('hilfe')}Hilfe</button><div class="helpsteps"><span>Hilfe</span>${Array.from({ length: maxHelp() }, (_, i) => `<i class="${i < st.help ? 'on' : ''}"></i>`).join('')}</div></div>`;
  }
  function pips(){
    return `<div class="progress">${Array.from({ length: session.total }, (_, i) => { const r = session.results[i]; const cls = i < session.index ? (r && r.score >= .5 ? 'done' : 'soft') : i === session.index ? 'now' : '';
      return `<span class="pip ${cls}">${i < session.index ? icon('check') : ''}</span>`; }).join('')}</div>`;
  }

  const scr = {
    mood: 'action', fx: 'action',
    html(port){
      const tk = T();
      const L = port ? { tp: 'left:20px;right:20px;top:100px;height:530px', ch: { x: 10, y: 640, w: 150 }, bub: 'left:176px;top:648px;right:20px', kp: 'left:20px;right:20px;top:800px;height:360px' }
                     : { tp: 'left:24px;top:100px;width:726px;height:476px', ch: { x: 16, y: tk.kind ? 590 : 590, w: 180 }, bub: 'left:212px;top:596px;width:538px', kp: 'left:772px;top:100px;width:384px;height:700px' };
      const storyHidden = st.gave || (tk.genericStory && st.help >= 3 && !['line', 'shape', 'chart', 'deal'].includes(tk.kind) && tk.viz);
      return sceneB() + `<div class="search"><i></i><i></i></div><div class="ui">
        <div class="topbar"><button class="btn sec round" data-act="home" aria-label="Zurück">${icon(session.kind === 'test' ? 'zurueck' : session.kind === 'placement' ? 'haus' : 'karte')}</button><div class="title-chip">${icon(session.icon)}${port ? '' : session.title}</div>${pips()}<div class="grow"></div>${gemChip()}</div>
        <div class="panel tp" style="${L.tp}">
          <div class="head"><span class="kick">${tk.title} · Rätsel ${session.index + 1} von ${session.total}</span><span class="grow"></span>${Draw.frame(tk.frame)}</div>
          ${storyHidden ? '' : `<p class="story ${tk.story.length > 95 ? 'long' : ''}">${tk.story}</p>`}
          <div class="work" data-work>${workHTML()}</div>
        </div>
        ${partnerEl({ ...L.ch, expr: st.msg.expr })}
        <div class="bubble" data-bubble style="${L.bub}"><span class="who">${App.pName()}</span><span data-say>${st.msg.text}</span></div>
        <div class="panel kp" style="${L.kp}">${helpBtnHTML(port)}<div data-input style="flex:1;display:flex;flex-direction:column;min-height:0">${inputHTML(port)}</div></div>
      </div>`;
    },
    bind(el){
      if (st.leaving) st.leaving = false; // z. B. nach dem Drehen: Hinweiskarte kann erneut geöffnet werden
      el.querySelector('[data-act="home"]').onclick = () => { if (session.kind === 'test') App.show(ParentsScreen('werkstatt')); else App.show(App.p.placementDone ? MapScreen(session.caseId ? { focus: CASE[session.caseId].node } : {}) : StartScreen()); };
      el.addEventListener('click', onClick);
      const svg = el.querySelector('.nl'); if (svg && T().q.mode === 'place' && !st.solved) bindLine(svg);
      if (st.solved) el.querySelector('.frame-ic')?.classList.add('open');
    },
    onKey(k){ key(k); },
    _st: () => st, _session: session
  };
  const say = (text, expr, good) => { st.msg = { text, expr, good }; bubbleSay(text, expr, good); };
  const redraw = (full) => {
    if (full){ App.render(false); return; }
    const w = App.root.querySelector('[data-work]'); if (w) w.innerHTML = workHTML();
    const svg = App.root.querySelector('.nl'); if (svg && T().q.mode === 'place' && !st.solved) bindLine(svg);
  };

  function onClick(e){
    const b = e.target.closest('[data-k],[data-act],[data-choice],[data-slot],[data-plate],[data-cell],[data-carry]'); if (!b) return;
    if (b.dataset.k){ key(b.dataset.k); return; }
    const a = b.dataset.act;
    if (a === 'help') return help();
    if (a === 'check') return check();
    if (a === 'next') return next();
    if (a === 'similar') return similar();
    if (b.dataset.choice && !st.solved && !st.gave){ st.inp.c = b.dataset.choice; Sound.key(); redraw(); App.root.querySelectorAll('[data-choice]').forEach(x => x.classList.toggle('sel', x.dataset.choice === st.inp.c)); setTimeout(check, 260); return; }
    if (b.dataset.slot && !st.solved){ st.focus = b.dataset.slot; redraw(); return; }
    if (b.dataset.plate != null && !st.solved){ const left = T().q.total - st.dealt.reduce((x, y) => x + y, 0); if (left > 0){ st.dealt[+b.dataset.plate]++; Sound.tone(900 + st.dealt[+b.dataset.plate] * 60, .08, 'triangle', .07); redraw(); } else { Sound.no(); say('Alle sind ausgeteilt! Wie viele liegen auf jedem?', 'nachdenklich'); } return; }
    if (b.dataset.cell != null && !st.solved){ st.wr.focus = +b.dataset.cell; redraw(); return; }
    if (b.dataset.carry != null && !st.solved){ const i = +b.dataset.carry; st.wr.c[i] = st.wr.c[i] ? 0 : 1; Sound.key(); redraw(); return; }
  }
  function key(k){
    if (st.solved || (st.gave && session.allowSolution)){ if (k === 'ok') next(); return; }
    if (!usesKeypad()){ if (k === 'ok') check(); return; }
    Sound.key();
    if (k === 'ok') return check();
    if (T().kind === 'written'){
      const W = st.wr;
      if (k === 'del'){ if (W.d[W.focus] === '' && W.focus < T().q.w - 1) W.focus++; W.d[W.focus] = ''; }
      else { W.d[W.focus] = k; if (W.focus > 0) W.focus--; }
      redraw(); return;
    }
    const s = st.focus; if (!s) return;
    const cur = st.inp[s] || '';
    if (k === 'del') st.inp[s] = cur.slice(0, -1);
    else if (cur.length < 7) st.inp[s] = (cur === '0' ? '' : cur) + k;
    st.rightSlots = (st.rightSlots || []).filter(x => x !== s);
    redraw();
  }
  function readInput(){
    const tk = T();
    if (tk.kind === 'written'){
      const d = st.wr.d, first = d.findIndex(x => x !== '');
      if (first < 0) return { missing: 'Tippe die Ziffern von rechts nach links ein.' };
      if (d.slice(first).some(x => x === '')) return { missing: 'Da fehlt noch eine Ziffer im Ergebnis.' };
      return { inp: { a: +d.slice(first).join('') } };
    }
    if (tk.kind === 'line' && tk.q.mode === 'place') return { inp: { pos: st.linePos } };
    if (isChoice()) return st.inp.c ? { inp: { c: st.inp.c } } : { missing: 'Tippe auf eine Antwort.' };
    const inp = {};
    for (const s of slots()){ if (st.inp[s] == null || st.inp[s] === ''){ st.focus = s; return { missing: slots().length > 1 ? 'Fülle zuerst alle Lücken aus.' : 'Tippe zuerst eine Zahl in den Ziffernblock.' }; } inp[s] = +st.inp[s]; }
    return { inp };
  }
  function check(){
    if (st.solved || st.gave) return;
    const r = readInput();
    if (r.missing){ say(r.missing, 'nachdenklich'); redraw(); return; }
    const tk = T(), inp = r.inp, ok = Object.keys(tk.ans).every(k => inp[k] === tk.ans[k]);
    if (ok) return solved();
    st.wrongs++; Sound.no();
    const dg = tk.diagnose ? tk.diagnose(inp) : null;
    if (dg && dg.p && !st.pattern) st.pattern = dg.p;
    // Richtige Teillösungen stehen lassen, falsche leeren
    if (tk.kind !== 'written' && !isChoice() && !(tk.kind === 'line' && tk.q.mode === 'place')){
      st.rightSlots = slots().filter(s => inp[s] === tk.ans[s]);
      App.root.querySelectorAll('.slot').forEach(x => { if (!st.rightSlots.includes(x.dataset.slot)){ x.classList.remove('wrong'); void x.offsetWidth; x.classList.add('wrong'); } });
    }
    if (tk.kind === 'written'){ const tb = App.root.querySelector('.wr'); tb && tb.classList.add('shake'); }
    if (isChoice()) App.root.querySelectorAll('[data-choice].sel').forEach(x => x.classList.add('wrong'));
    let text = dg && dg.msg ? dg.msg : RND.pick(WRONG), expr = 'nachdenklich';
    if (session.kind === 'placement' && st.wrongs >= session.maxWrong){
      say('Das ist ein Schloss für später. Wir knacken es bald zusammen!', 'freudig');
      st.locked = true; setTimeout(() => finishTask(.1), 1600); lockInputs(); return;
    }
    if (session.allowSolution && st.wrongs >= 4 && st.help < 4){ st.help = 3; setTimeout(() => help(), 900); }
    else if (st.wrongs === 2 && st.help < 2){ st.help = 1; text += ' ' + tk.hints[1]; st.help = 2; }
    else if (st.wrongs === 3 && st.help < 3){ st.help = 3; text += ' ' + tk.hints[2]; if (tk.kind === 'written' && tk.q.op === '+'){ st.wr.c = Array.from({ length: tk.q.w }, (_, i) => tk.viz.carries[i] ? 1 : 0); } }
    say(text, expr);
    const helpBefore = st.help;
    setTimeout(() => {
      if (st.gave || st.solved || st.locked || App.cur !== scr) return;
      if (st.help >= 3 && helpBefore >= 3 && tk.kind === 'deal') autoDeal();
      if (tk.kind === 'written'){ st.wr.d = st.wr.d.map(() => ''); st.wr.focus = tk.q.w - 1; }
      else if (!isChoice()) for (const s of slots()) if (!(st.rightSlots || []).includes(s)) st.inp[s] = '';
      if (!isChoice()){ const f = slots().find(s => !(st.rightSlots || []).includes(s)); if (f) st.focus = f; }
      if (isChoice()) st.inp.c = null;
      redraw(true);
    }, 950);
  }
  function lockInputs(){ App.root.querySelectorAll('[data-input] button,[data-act="help"]').forEach(b => b.disabled = true); }
  function score(){ return st.gave ? 0 : clamp(1 - .25 * st.wrongs - [0, .05, .3, .5, .5][st.help], .15, 1); }
  function solved(){
    st.solved = true; const tk = T(), sc = score(), gems = st.wrongs === 0 && st.help === 0 ? 5 : 3;
    const praise = st.wrongs === 0 && st.help === 0 ? (PRAISE_SKILL[tk.skill] && Math.random() < .5 ? PRAISE_SKILL[tk.skill] : RND.pick(PRAISE_FAST)) : st.help >= 2 ? RND.pick(PRAISE_HELP) : RND.pick(PRAISE_TRY);
    st.msg = { text: praise, expr: 'freudig', good: true };
    st.result = { score: sc, pattern: st.pattern, ms: Date.now() - st.t0, gems };
    session.record(tk, st.result); st.recorded = true;
    redraw(true);
    const fr = App.root.querySelector('.frame-ic'), pa = App.root.querySelector('.ui .char:not([data-kind="detective"])');
    fr.classList.remove('open');
    magicZap(pa, fr, (x, y) => flyGems(gems, x, y));
    bubbleSay(praise, 'freudig', true);
  }
  function help(){
    if (st.solved || st.help >= maxHelp()) return;
    st.help++; Sound.sparkle();
    const tk = T();
    if (st.help === 3){
      if (tk.kind === 'deal'){ autoDeal(); }
      if (tk.kind === 'written' && tk.q.op === '+'){ st.wr.c = Array.from({ length: tk.q.w }, (_, i) => tk.viz.carries[i] ? 1 : 0); }
    }
    if (st.help === 4){
      st.gave = true;
      if (!isChoice()) for (const s of slots()) st.inp[s] = String(tk.ans[s]);
      if (isChoice()) st.inp.c = tk.ans.c;
      if (tk.kind === 'written') st.wr.d = String(tk.ans.a).padStart(tk.q.w, ' ').split('').map(x => x.trim());
      st.result = { score: 0, pattern: st.pattern, ms: Date.now() - st.t0, gems: 1 };
      session.record(tk, st.result); st.recorded = true; App.p.gems += 1; App.save();
      st.msg = { text: 'So geht der Lösungsweg. Schau ihn dir in Ruhe an. Danach probierst du eine ähnliche Aufgabe selbst!', expr: 'normal' };
      redraw(true); return;
    }
    const text = st.help === 3 ? tk.hints[2] : tk.hints[st.help - 1];
    st.msg = { text, expr: st.help === 1 ? 'freudig' : 'nachdenklich' };
    redraw(true);
  }
  function autoDeal(){
    const q = T().q, mine = st; let k = 0;
    if (mine.dealing) return; mine.dealing = true;
    // Austeilen stoppt sofort, wenn die Aufgabe gewechselt wurde oder der Bildschirm verlassen wird
    const iv = setInterval(() => { if (st !== mine || App.cur !== scr || !st.dealt){ clearInterval(iv); return; } const left = q.total - st.dealt.reduce((a, b) => a + b, 0); if (left <= 0){ clearInterval(iv); mine.dealing = false; return; }
      st.dealt[k % q.groups]++; k++; Sound.tone(900 + k * 20, .06, 'triangle', .05); redraw(); }, 160);
  }
  function similar(){
    st.similarUsed = true;
    const tk = generate(T().skill, T().diff, [T().key, ...App.p.recent]);
    const keepIndex = session.index;
    st = fresh(tk); st.similarUsed = true; session.index = keepIndex;
    session.results.pop(); // der gezeigte Lösungsweg zählt nicht als eigene Runde
    const s = tk.parts && tk.parts.find(p => p.slot); st.focus = s ? s.slot : null;
    st.msg = { text: 'Jetzt du! Diese Aufgabe funktioniert genauso.', expr: 'freudig' };
    App.render(true);
  }
  function finishTask(sc){
    if (!st.recorded){ st.result = { score: sc, pattern: st.pattern, ms: Date.now() - st.t0, gems: 0 }; session.record(T(), st.result); st.recorded = true; }
    next();
  }
  function next(){
    if (!st.recorded || st.leaving) return;
    const done = session.index;
    const go = () => { session.index = done + 1; if (session.index >= session.total){ App.save(); session.finish(); return; } newTask(); App.render(true); };
    st.leaving = true;
    if (session.between) session.between(done, go); else go();
  }
  function bindLine(svg){
    const q = T().q, x0 = +svg.dataset.x0, x1 = +svg.dataset.x1;
    const toVal = e => { const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * 640; const v = q.min + (sx - x0) / (x1 - x0) * (q.max - q.min); return clamp(Math.round((v - q.min) / q.snap) * q.snap + q.min, q.min, q.max); };
    let drag = false;
    const move = e => { const v = toVal(e); if (v !== st.linePos){ st.linePos = v; const g = svg.querySelector('[data-lupe]'); if (g) g.setAttribute('transform', `translate(${x0 + (v - q.min) / (q.max - q.min) * (x1 - x0)} 92)`); Sound.tone(700, .03, 'sine', .03); } };
    svg.addEventListener('pointerdown', e => { drag = true; try { svg.setPointerCapture(e.pointerId); } catch (_){} move(e); e.preventDefault(); });
    svg.addEventListener('pointermove', e => { if (drag) move(e); });
    svg.addEventListener('pointerup', () => { drag = false; });
    svg.addEventListener('pointercancel', () => { drag = false; });
  }
  return scr;
}

function parentGate(ok){
  const a = RND.int(12, 19), b = RND.int(3, 8), ans = a * b; let val = '';
  const g = document.createElement('div'); g.className = 'gate';
  g.innerHTML = `<div class="panel box"><div style="font-size:18px;font-weight:700;color:var(--ink-soft);text-align:center">Elternbereich · Bitte rechnen:</div><div class="q">${a} · ${b} = <span class="slot focus" data-v style="font-size:48px">&nbsp;</span></div>
    <div class="keypad" style="grid-auto-rows:64px">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button class="key" data-g="${k}">${k}</button>`).join('')}<button class="key del" data-g="del">${icon('loeschen')}</button><button class="key" data-g="0">0</button><button class="key ok" data-g="ok">${icon('check')}</button></div>
    <button class="btn sec" data-g="x">Abbrechen</button></div>`;
  App.root.appendChild(g);
  g.addEventListener('click', e => { const k = e.target.closest('[data-g]')?.dataset.g; if (!k) return;
    if (k === 'x'){ g.remove(); return; }
    if (k === 'del') val = val.slice(0, -1); else if (k === 'ok'){ if (+val === ans){ g.remove(); ok(); } else { val = ''; const s = g.querySelector('[data-v]'); s.classList.remove('wrong'); void s.offsetWidth; s.classList.add('wrong'); Sound.no(); } }
    else if (val.length < 4) val += k;
    g.querySelector('[data-v]').innerHTML = val || '&nbsp;'; });
}

      ${!p.lastBackup || Date.now() - p.lastBackup > 14 * 864e5 ? `<div class="pcard hint"><p class="txt">${icon('sichern')}<span>${p.lastBackup ? 'Die letzte Sicherung ist über zwei Wochen alt.' : 'Es gibt noch keine Sicherung des Spielstands.'} Unter „Einstellungen“ können Sie ihn als Datei sichern.</span></p></div>` : ''}

      <div class="pcard legend"><h3>So lesen Sie die Balken</h3><div class="lg">

        <p class="note">Eingefärbt wird erst ab 3 eigenen Aufgaben, vorher wäre es Zufall. Farben: <b class="c-good">grün = sicher</b> (ab 70 %), <b class="c-mid">gelb = übt noch</b> (45–69 %), <b class="c-low">rot = Schwerpunkt</b> (unter 45 %). Ein gestrichelter Rahmen um die Einstufung heißt „vorläufig“. Die Prozentzahl ist die geschätzte Beherrschung, nicht der Anteil richtiger Antworten.</p></div>

      ${k4.map(s => { const m = (p.settings.k4 || {})[s.id] || 'auto'; return `<div class="sk" style="grid-template-columns:1fr auto"><span>${s.name}<br><small style="color:var(--ink-soft)">${Model.available(p, s.id) ? 'im Spiel' : 'noch nicht im Spiel'}</small></span><span class="seg">${[['auto', 'Automatisch'], ['on', 'An'], ['off', 'Aus']].map(([v, l]) => `<button class="${m === v ? 'on' : ''}" data-k4="${s.id}" data-v="${v}">${l}</button>`).join('')}</span></div>`; }).join('')}</div>
      <div class="pcard"><h3>Anspruch</h3><p style="margin:0 0 10px;font-size:16px;line-height:1.45;color:var(--ink-soft)">Das Spiel passt sich automatisch an. Hier können Sie die Aufgaben insgesamt etwas schwerer oder leichter einstellen. „Etwas mehr“ entspricht etwa dem Stand Ende Klasse 3.</p>
        <span class="seg">${LEVELS.map((L, i) => `<button class="${(p.settings.level ?? 1) === i ? 'on' : ''}" data-level="${i}">${L.n}</button>`).join('')}</span></div>
      <div class="pcard"><h3>Ton</h3><p class="txt" style="font-size:16px;color:var(--ink-soft);margin-bottom:10px">Klänge und Musik lassen sich getrennt abschalten, auch im Spiel auf dem Startbildschirm. Die Musik wird nach 20 Minuten automatisch leiser.</p><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="pbtn" data-set="sound">${icon('vorlesen')}Klänge: ${p.settings.sound !== false ? 'an' : 'aus'}</button><button class="pbtn" data-set="music">${icon('ton')}Musik: ${p.settings.music !== false ? 'an' : 'aus'}</button></div></div>

      <div class="pcard"><h3>Spielstand sichern</h3><p class="txt" style="font-size:16px;color:var(--ink-soft)">Safari kann Website-Daten löschen, wenn das Spiel lange nicht geöffnet wurde. Außerdem haben Safari und das Symbol auf dem Home-Bildschirm getrennte Speicher. Sichern Sie den Spielstand deshalb ab und zu. Die Sicherung enthält nur Spieldaten (Name im Spiel, Fortschritt, Einstellungen) und bleibt auf Ihrem Gerät.</p>

          <div class="row"><button class="pbtn dark" data-set="file">${icon('sichern')}Als Datei sichern</button><button class="pbtn" data-set="fileload">${icon('laden')}Aus Datei laden</button><input type="file" id="bkfile" accept=".json,.txt,application/json,text/plain" hidden></div></div>

  }

    mood: null, fx: 'none',
    html(){
      return `<div class="par"><div class="par-head"><button class="pbtn" data-act="back">${icon('zurueck')}Zurück zum Spiel</button><h1>Elternbereich</h1><span class="grow"></span><div class="par-tabs">${tabs.map(([k, l]) => `<button class="pbtn ${tab === k ? 'dark' : ''}" data-tab="${k}">${l}</button>`).join('')}</div></div><div class="par-body">${body()}</div></div>`;
    },
    bind(el){

      if (fi) fi.addEventListener('change', () => { const f = fi.files && fi.files[0]; if (!f) return;

        r.onerror = () => toast('Die Datei konnte nicht gelesen werden.'); r.readAsText(f); });
      el.addEventListener('click', e => {

        if (b.dataset.try) return App.show(TaskScreen(testSession(b.dataset.try, +b.dataset.d)));

        if (b.dataset.k4){ p.settings.k4[b.dataset.k4] = b.dataset.v; App.save(); App.render(false); return; }
        const s = b.dataset.set;
        if (s === 'sound'){ p.settings.sound = p.settings.sound === false; App.save(); App.render(false); }
        if (s === 'music'){ p.settings.music = p.settings.music === false; App.save(); if (p.settings.music) Sound.unlock(); App.render(false); }

        if (s === 'export'){ p.lastBackup = Date.now(); App.save(); const code = Store.exportCode(), box = el.querySelector('#codebox'); box.value = code;
          const done = () => toast('Sicherungscode kopiert'); const fail = () => { box.focus(); box.select(); toast('Bitte den markierten Code kopieren'); };
          try { navigator.clipboard.writeText(code).then(done, fail); } catch (_){ fail(); } }
        if (s === 'import'){ try { Store.importCode(el.querySelector('#codebox').value); App.p = Store.profile(); toast('Spielstand wiederhergestellt'); App.show(ParentsScreen('sicher')); } catch (err){ toast(err.message); } }
        if (s === 'file'){
          if (IS_PREVIEW){ toast('In der Vorschau geht das Speichern als Datei nicht. In der fertigen App klappt es. Bitte hier „Code kopieren“ nutzen.'); return; }
          p.lastBackup = Date.now(); App.save();
          const blob = new Blob([Store.exportFile()], { type: 'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a');
          a.href = url; a.download = `zauberdetektei-sicherung-${Report.day()}.json`; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          const n = el.querySelector('[data-last]'); if (n) n.textContent = `Letzte Sicherung: ${dateDE(p.lastBackup)}`;
          toast('Sicherung wird gespeichert');
        }
        if (s === 'fileload') el.querySelector('#bkfile').click();
        if (s === 'partner'){ p.setupDone = false; App.save(); App.show(PartnerScreen()); }
        if (s === 'placement'){ p.placementDone = false; App.save(); App.show(placementIntro()); }
        if (s === 'reset'){ el.querySelector('[data-confirm]').innerHTML = `<p style="font-size:16px;margin:12px 0 8px">Wirklich alles löschen? Das kann man nicht rückgängig machen.</p><button class="pbtn dark" data-set="reset2">Ja, löschen</button>`; }
        if (s === 'reset2'){ const np = newProfile(p.name); Store.mem.profiles = { [np.id]: np }; Store.mem.active = np.id; App.p = np; App.save(); App.show(StartScreen()); }
      });
    }
  };
}

const MAP_NODES = [
  { k: 'hq', name: 'Hauptquartier', L: [130, 720], P: [130, 730] },

  { k: 'wiese', name: 'Wolkenhasen-Wiese', soon: true, L: [470, 320], P: [220, 340] },
  { k: 'sternwarte', name: 'Sternwarte', soon: true, L: [640, 236], P: [560, 250] }
];
const pinSVG = () => `<svg class="pin" viewBox="0 0 56 70"><path d="M28 68 C28 68 4 42 4 27 a24 24 0 0 1 48 0 C52 42 28 68 28 68z" style="fill:var(--primary)" stroke="#fff" stroke-width="3"/><circle cx="28" cy="27" r="14" fill="#fff"/>${starShape(28, 27, 10, 'var(--gold)')}</svg>`;
const fogSVG = (cls = '') => `<svg class="fog ${cls}" viewBox="0 0 170 90"><g fill="#CFC4F2" opacity=".9"><circle cx="40" cy="50" r="30"/><circle cx="80" cy="40" r="36"/><circle cx="125" cy="52" r="28"/><rect x="18" y="50" width="130" height="30" rx="15"/></g></svg>`;

/* Der aktuelle Fall: der erste freigeschaltete, der noch nicht gelöst ist */
function currentCase(p){ return CASES.find(c => caseUnlocked(p, c) && (p.cases[c.id] || {}).status !== 'done') || null; }
function nodeStatus(n){
  const p = App.p;
  if (n.k === 'hq') return 'home';
  if (n.soon) return 'soon';
  const c = CASE[n.cs], cs = p.cases[c.id];
  if (cs && cs.status === 'done') return 'done';
  if (!caseUnlocked(p, c)) return 'locked';
  return cs && cs.step > 0 ? 'now' : 'open';
}
function mapBG(){
  const r = rng(21); let blocks = '';
  for (let gx = 0; gx < 12; gx++) for (let gy = 0; gy < 9; gy++){
    const x = gx * 110 + 14, y = gy * 104 + 12;
    blocks += `<rect x="${x}" y="${y}" width="92" height="86" rx="14" fill="${r() > .8 ? '#2E1A63' : '#241350'}"/>`;
    if (r() > .45) for (let k = 0; k < 4; k++) blocks += `<rect x="${x + 12 + k * 18}" y="${y + 14 + (k % 2) * 30}" width="8" height="8" rx="2" fill="${r() > .5 ? '#FFD66B' : '#FF8AD6'}" opacity="${(.3 + r() * .6).toFixed(2)}"/>`;
  }
  let sp = ''; for (let i = 0; i < 16; i++) sp += sparkle(r() * 1260, r() * 900, 3 + r() * 5, i % 2 ? '#fff' : '#FFD66B', `class="twinkle" style="animation-delay:${(-r() * 3).toFixed(1)}s"`);
  return layer(.1, `<rect width="1260" height="900" fill="#150B34"/>${blocks}
    <path d="M1260 300 C1060 360 1000 480 1040 620 C1080 760 980 840 940 900" fill="none" stroke="#4EE8FF" stroke-width="40" opacity=".18"/>
    <path d="M1260 300 C1060 360 1000 480 1040 620 C1080 760 980 840 940 900" fill="none" stroke="#4EE8FF" stroke-width="6" opacity=".6"/>${sp}`) + '<div class="vignette"></div>';
}
function mapPaths(port){
  const pts = MAP_NODES.map(n => { const [x, y] = port ? n.P : n.L; return [x, y - 30]; });
  let s = '';
  for (let i = 0; i < pts.length - 1; i++){
    const st = nodeStatus(MAP_NODES[i + 1]), locked = st === 'locked' || st === 'soon';
    const q = `M${pts[i][0]} ${pts[i][1]} Q${(pts[i][0] + pts[i + 1][0]) / 2 + (i % 2 ? 60 : -60)} ${(pts[i][1] + pts[i + 1][1]) / 2} ${pts[i + 1][0]} ${pts[i + 1][1]}`;
    s += locked ? `<path d="${q}" fill="none" stroke="#6A55A0" stroke-width="4" stroke-dasharray="10 12" opacity=".7"/>` : neon(q, '#FF5FC4');
  }
  const W = port ? 820 : 1180, H = port ? 1180 : 820;
  return `<svg class="abs" style="left:0;top:0;z-index:2;pointer-events:none" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${s}</svg>`;
}
function nodeHTML(n, port, sel, reveal){
  const st = nodeStatus(n), [x, y] = port ? n.P : n.L, cur = currentCase(App.p);
  const isCur = cur && n.cs === cur.id;
  const badge = st === 'done' ? `<span class="nbadge done">${icon('check')}</span>` : st === 'locked' ? `<span class="nbadge lock">${icon('schloss')}</span>` : st === 'soon' ? '<span class="nbadge soon">BALD</span>' : st === 'open' ? '<span class="nbadge new">NEU</span>' : '';
  const fog = st === 'locked' || st === 'soon' ? fogSVG() : reveal === n.k ? fogSVG('lift') : '';
  return `<div class="node ${st === 'locked' || st === 'soon' ? 'locked' : ''} ${sel ? 'sel' : ''} ${reveal === n.k ? 'reveal' : ''}" data-node="${n.k}" style="left:${x - 70}px;top:${y - 140}px">
    <div class="bld">${BUILD[n.k]()}${fog}</div>${badge}${isCur ? pinSVG() : ''}<span class="plate">${n.name}</span></div>`;
}
const cluePips = (have, withText = true) => `<div class="cluepips">${Array.from({ length: 5 }, (_, i) => `<i class="${i < have ? 'on' : ''}">${icon('lupe')}</i>`).join('')}${withText ? `<span>${have} von 5 Hinweisen</span>` : ''}</div>`;
function suspectsHTML(c){

function infoHTML(k, msg){
  const n = MAP_NODES.find(x => x.k === k), st = nodeStatus(n), p = App.p, P = App.pName();
  const box = (top, mid, tipText, btn) => `<div class="itop ${mid ? '' : 'full'}">${top}</div>${mid ? `<div class="imid">${mid}</div>` : ''}<div class="ibot">${mapTip(msg || tipText)}${btn}</div>`;

      `<button class="btn" data-go="hq">${icon('sofa')}Einrichten</button>`);
  }
  if (st === 'soon') return box(`<div class="kicker">Neuer Ort</div><h2>${n.name}</h2><p>Dieser Ort liegt noch im Nebel. Hier wartet bald ein neuer Fall.</p>`, '',
    (p.cases.c3 || {}).status === 'done' ? 'Pünktchen will nach Hause. Bald finden wir den Weg zur Sternwarte!' : 'Löse zuerst die Fälle, die schon offen sind.',
    `<button class="btn" disabled>${icon('schloss')}Bald</button>`);
  const c = CASE[n.cs], cs = p.cases[c.id] || { step: 0 };
  if (st === 'locked'){
    const prev = CASES[CASES.indexOf(c) - 1];
    return box(`<div class="kicker">Fall ${c.nr}</div><h2>${n.name}</h2><p>Dieser Ort ist noch im Nebel. Löse zuerst den Fall „${prev.title}“.</p>`, '',
      'Ein Fall nach dem anderen. So machen es echte Detektivinnen!', `<button class="btn" disabled>${icon('schloss')}Noch zu</button>`);
  }
  if (st === 'done'){
    const running = cs.replay && cs.step > 0;
    const V = running ? caseView(c) : c;
    return box(`<div class="kicker">Fall ${c.nr} · ${running ? 'neue Version' : 'gelöst'}</div><h2>${V.title}</h2><p>${running ? V.teaser : c.done}</p>`,
      `<div class="sub">Deine Sterne</div><div class="minis">${[0, 1, 2].map(i => starSVG(i >= cs.stars)).join('')}</div>${running ? cluePips(cs.step) : ''}`,
      running ? 'Wir sind mitten in der Wiederholung.' : cs.stars < 3 ? 'Nochmal spielen? Es wartet ein neues Rätsel mit anderem Täter!' : 'Drei Sterne! Nochmal spielen? Es wartet ein anderer Täter.',
      `<button class="btn ${running ? '' : 'sec'}" data-go="case">${running ? `${icon('lupe')}Weiter` : `${icon('weiter')}Nochmal`}</button>`);
  }
  const accuse = cs.step >= 5;
  return box(`<div class="kicker">Fall ${c.nr} · ${st === 'open' ? 'neu' : 'läuft'}</div><h2>${c.title}</h2><p>${c.teaser}</p>`,
    `<div class="sub">Verdächtige</div>${suspectsHTML(c)}${cluePips(cs.step)}`,
    accuse ? 'Wir haben alle Hinweise! Wer war es?' : st === 'open' ? 'Ein neuer Fall! Bist du bereit?' : `Schon ${cs.step} von 5 Hinweisen. Weiter so!`,
    `<button class="btn" data-go="case">${icon('lupe')}${accuse ? 'Wer war es?' : st === 'open' ? 'Fall starten' : 'Weiter'}</button>`);
}
