<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zauber-Detektei</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zauber-Detektei">
<meta name="theme-color" content="#1B1142">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<style>
/* =====================================================================
   DESIGN-SYSTEM · Glitzerstadt bei Nacht
   Alle Farben, Rundungen und Größen als Variablen: hier zentral ändern.
   ===================================================================== */
:root{
  --font-display:"Futura","Avenir Next Condensed","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Avenir Next",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --font-math:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;
  --font-note:"Avenir Next Condensed","Futura",system-ui,sans-serif;
  --ink:#FFF3FD; --ink-soft:#CDB6F0;
  --primary:#FF4FB8; --primary-light:#FF8AD6; --primary-dark:#B01E7E;
  --accent:#4EE8FF; --accent-light:#A8F6FF; --accent-dark:#1A9DBA;
  --lilac:#9C7BFF; --butter:#FFD66B; --peach:#FF9E7A; --gold:#FFD66B;
  --gem-1:#FFFFFF; --gem-2:#6FF2FF; --gem-3:#D24DFF;
  --paper:#241449; --paper-2:#2F1A5C; --line:#5B3C9A;
  --sky-1:#1B1142; --sky-2:#4A1C72; --sky-3:#FF7FA8;
  --math-ink:#FFFFFF; --math-bg:#1A0F3A; --math-slot:#2B1860;
  --good:#5BE3A8; --locked:#5A4A7E;
  --skin:#FFD9C6; --skin-light:#FFF0E8; --skin-shade:#E7A58F; --blush:#FF6FB0;
  --hair:#2E1B4F; --hair-light:#5C3D93; --hair-shade:#1A0E30;
  --coat:#8E5BFF; --coat-light:#C3A2FF; --coat-shade:#5B2FC7;
  --cap:#FF4FB8; --cap-shade:#B01E7E; --legs:#2A1A4A; --boot:#FF4FB8;
  --eye:#1E1236; --iris:#6FD8FF; --mouth:#7A1E5A;
  --p-1:#FFFFFF; --p-2:#E4D8FF; --p-hair:#FF7AD9; --p-hair-shade:#B64CFF;
  --wing-1:#FFFFFF; --wing-2:#7FF3FF; --wing-3:#FF8AE0;
  --mane-1:#FF4FB8; --mane-2:#4EE8FF; --mane-3:#B06BFF; --horn:#FFF3B0;
  --outline:transparent; --outline-w:0px; --rim:#6FF2FF;
  --r-sm:10px; --r-md:18px; --r-lg:26px; --r-pill:999px;
  --btn-depth:5px;
  --shadow-soft:0 10px 26px rgba(10,0,40,.45);
  --shadow-deep:0 22px 50px rgba(5,0,25,.6);
  --glow:0 0 18px rgba(255,80,190,.9),0 0 42px rgba(255,80,190,.45);
  --panel-bg:linear-gradient(160deg,rgba(90,50,170,.8) 0%,rgba(38,18,86,.92) 100%);
  --panel-border:rgba(190,160,255,.55);
  --key-bg:linear-gradient(180deg,#3B2380,#2A1760); --key-ink:#FFFFFF; --key-edge:#150A38;
  color-scheme:dark;
}

/* ============ Grundgerüst: Bühne, die sich ans iPad anpasst ============ */
html,body{margin:0;height:100%;background:#120A2E;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 40%,#2A1463,#120A2E 70%);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
#frame{position:relative;overflow:hidden;flex:0 0 auto}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--sky-1)}
#stage.land{width:1180px;height:820px}
#stage.port{width:820px;height:1180px}
#stage *{box-sizing:border-box}
.screen{position:absolute;inset:0;overflow:hidden}
.screen.enter{animation:scrIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes scrIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.layer{position:absolute;inset:-40px;will-change:transform;pointer-events:none}
.layer>svg{width:100%;height:100%;display:block}
.ui{position:absolute;inset:0;z-index:5}
.fx{position:absolute;left:0;top:0;z-index:60;pointer-events:none}
.abs{position:absolute}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(10,0,30,.55) 100%)}
.dim{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(180deg,rgba(18,8,46,.15),rgba(18,8,46,.45))}
.search{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.search i{position:absolute;bottom:-40px;width:300px;height:1300px;margin-left:-150px;transform-origin:50% 100%;clip-path:polygon(46% 100%,54% 100%,100% 0,0 0);background:linear-gradient(0deg,rgba(120,240,255,.26),rgba(120,240,255,0) 80%);animation:sweep 5.5s ease-in-out infinite alternate}
.search i:nth-child(1){left:24%;--r0:-26deg;--r1:20deg}
.search i:nth-child(2){left:78%;--r0:26deg;--r1:-20deg;animation-duration:6.8s;background:linear-gradient(0deg,rgba(255,120,210,.26),rgba(255,120,210,0) 80%)}
@keyframes sweep{from{transform:rotate(var(--r0))}to{transform:rotate(var(--r1))}}
.warm{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(55% 50% at 24% 62%,rgba(255,190,120,.35),rgba(255,190,120,0) 70%),radial-gradient(40% 40% at 72% 42%,rgba(255,160,215,.14),rgba(255,160,215,0) 70%);animation:breatheL 7s ease-in-out infinite alternate}
@keyframes breatheL{from{opacity:.65}to{opacity:1}}

/* ============ Figuren ============ */
.char{position:absolute;cursor:pointer;transform-origin:50% 100%}
.char svg{width:100%;height:100%;display:block;overflow:visible}
.char .idle{transform-origin:50% 100%;transform-box:fill-box;animation:breathe 3.4s ease-in-out infinite}
.char.float .idle{animation:floaty 3.8s ease-in-out infinite}
.char.hop{animation:hop .6s cubic-bezier(.3,.7,.3,1)}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}18%{transform:translateY(0) scale(1.08,.9)}45%{transform:translateY(-38px) scale(.95,1.06)}75%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
.wings{transform-box:fill-box;transform-origin:50% 60%;animation:flutter .5s ease-in-out infinite alternate}
@keyframes flutter{from{transform:scaleX(1)}to{transform:scaleX(.82)}}
.ex{display:none}
.ex.ex-normal{display:inline}
.char[data-expr="freudig"] .ex-freudig,.char[data-expr="nachdenklich"] .ex-nachdenklich,.char[data-expr="ueberrascht"] .ex-ueberrascht{display:inline}
.char:not([data-expr="normal"]) .ex-normal{display:none}
.rim,.horn-glow{display:inline}
.gloss{display:none}
.ground-shadow{fill:rgba(0,0,0,.45)}
.codechar{width:100%;height:100%}
.char.hasimg:not(.noimg) .codechar{display:none}
.char.noimg .imgchar{display:none}
.imgchar{position:relative;width:100%;height:100%}
.imgchar img{position:absolute;inset:-4% -4% 0 -4%;width:108%;height:104%;object-fit:contain;object-position:50% 100%;-webkit-user-drag:none;pointer-events:none;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
.char[data-kind="fairy"] .imgchar img{inset:-22% -22% 0 -22%;width:144%;height:122%}
.char[data-kind="detective"] .codechar svg{filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}

/* ============ Knöpfe ============ */
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--font-display);font-weight:800;color:#fff;letter-spacing:.06em;text-transform:uppercase;
  display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:64px;padding:0 32px;border-radius:var(--r-pill);font-size:26px;
  background:linear-gradient(180deg,var(--primary-light) 0%,var(--primary) 55%);
  box-shadow:0 var(--btn-depth) 0 var(--primary-dark),var(--glow),inset 0 2px 0 rgba(255,255,255,.55);
  text-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .08s,box-shadow .08s,filter .2s;position:relative;white-space:nowrap}
.btn .ic{width:30px;height:30px}
.btn:active,.btn.is-pressed{transform:translateY(var(--btn-depth));box-shadow:0 0 0 var(--primary-dark),0 0 10px rgba(255,80,190,.6),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.sec{background:linear-gradient(180deg,rgba(120,80,210,.95),rgba(60,30,130,.98));box-shadow:0 var(--btn-depth) 0 #1D0E48,0 0 0 2px rgba(180,150,255,.55) inset,0 0 18px rgba(120,220,255,.3)}
.btn.sec:active{box-shadow:0 0 0 #1D0E48,0 0 0 2px rgba(180,150,255,.55) inset}
.btn.mint{background:linear-gradient(180deg,var(--accent-light),var(--accent) 60%);color:#10213A;text-shadow:none;box-shadow:0 var(--btn-depth) 0 var(--accent-dark),0 0 18px rgba(80,230,255,.7),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.mint:active{box-shadow:0 0 0 var(--accent-dark)}
.btn[disabled],.btn.is-locked{filter:grayscale(.85) opacity(.55);cursor:default;transform:none}
.btn.big{min-height:100px;font-size:40px;padding:0 50px}
.btn.round{width:68px;min-height:68px;height:68px;padding:0;border-radius:50%}
.btn.round .ic{width:32px;height:32px}
.btn.small{min-height:54px;font-size:18px;padding:0 20px}
.btn.small .ic{width:24px;height:24px}
.btn.wide{width:100%}
.btn .lbl-s{font-size:15px;font-family:var(--font-body);font-weight:700;letter-spacing:.04em}

/* ============ Paneele, Chips, Sprechblasen ============ */
.panel{background:var(--panel-bg);border:2px solid var(--panel-border);border-radius:var(--r-lg);box-shadow:var(--shadow-deep),inset 0 1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(255,120,210,.25);position:relative}
.card{background:rgba(40,20,90,.8);border:2px solid var(--panel-border);border-radius:var(--r-md);box-shadow:var(--shadow-soft)}
.chip{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 20px 0 12px;border-radius:var(--r-pill);background:rgba(40,20,90,.85);border:2px solid var(--panel-border);box-shadow:var(--shadow-soft);font-weight:800;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.chip .gem{width:32px;height:32px}
.chip.bump{animation:bpop .4s}
.bubble{position:absolute;background:#2E1A63;color:var(--ink);border:2px solid var(--panel-border);border-radius:28px;padding:16px 24px;font-size:26px;line-height:1.3;box-shadow:0 0 0 1px rgba(78,232,255,.35),0 0 24px rgba(78,232,255,.28);font-weight:600;z-index:8}
.bubble::before{content:"";position:absolute;left:-16px;bottom:26px;width:30px;height:30px;background:inherit;border-left:2px solid var(--panel-border);border-bottom:2px solid var(--panel-border);transform:rotate(45deg);border-radius:0 0 0 8px}
.bubble.pop{animation:bpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bpop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.bubble .who{display:block;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;font-weight:800}
.bubble.good{border-color:#6FF2C6;box-shadow:0 0 0 1px rgba(111,242,198,.5),0 0 26px rgba(111,242,198,.35)}
.title-chip{white-space:nowrap;height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-radius:var(--r-pill);background:rgba(40,20,90,.85);border:2px solid var(--panel-border);box-shadow:var(--shadow-soft);font-family:var(--font-display);font-weight:800;font-size:23px;color:var(--ink);text-transform:uppercase;letter-spacing:.05em}
.title-chip .ic{width:28px;height:28px}
.topbar{position:absolute;left:24px;right:24px;top:20px;display:flex;align-items:center;gap:14px;z-index:20}
.topbar .grow{flex:1}
.progress{display:flex;gap:8px;align-items:center;height:64px;padding:0 18px;border-radius:var(--r-pill);background:rgba(40,20,90,.85);border:2px solid var(--panel-border);box-shadow:var(--shadow-soft)}
.progress .pip{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--paper-2);color:var(--locked);border:2px solid var(--line)}
.progress .pip.done{background:var(--gold);color:#3A2400;border-color:transparent;box-shadow:0 0 12px rgba(255,200,90,.7)}
.progress .pip.soft{background:#7C6BB0;color:#fff;border-color:transparent}
.progress .pip.now{background:var(--primary);color:#fff;border-color:transparent;animation:pulse 1.6s infinite}
.progress .pip .ic{width:17px;height:17px}
.progress .pip.pop{animation:bpop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,79,184,.6)}50%{box-shadow:0 0 0 9px rgba(255,79,184,0)}}
.ic{display:block}
.gem{display:block;overflow:visible}
.twinkle{animation:tw 2.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.flicker{animation:flick 4s steps(1) infinite}
@keyframes flick{0%,40%,44%,46%,100%{opacity:1}42%,45%{opacity:.35}}
.rise{animation:rise 14s linear infinite}
@keyframes rise{from{transform:translateY(40px);opacity:0}10%{opacity:1}85%{opacity:1}to{transform:translateY(-520px);opacity:0}}
.fade-in{animation:fadeIn .45s both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wiggle{animation:wig .5s}
@keyframes wig{20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.shake{animation:shk .42s}
@keyframes shk{15%{transform:translate(-7px,3px)}35%{transform:translate(6px,-4px)}55%{transform:translate(-4px,2px)}75%{transform:translate(2px,-1px)}}
.flash{position:absolute;inset:0;z-index:55;pointer-events:none;background:radial-gradient(circle at var(--fx) var(--fy),rgba(255,255,255,.95),rgba(255,120,210,.4) 18%,rgba(255,120,210,0) 45%);animation:flashO .7s forwards}
@keyframes flashO{from{opacity:1}to{opacity:0}}
.zap{position:absolute;left:0;top:0;z-index:54;pointer-events:none;overflow:visible;animation:flashO .35s .55s forwards}
.zap path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:zapD .38s ease-out forwards}
@keyframes zapD{to{stroke-dashoffset:0}}
.flygem{position:absolute;left:0;top:0;z-index:56;width:34px;height:34px;pointer-events:none}
.toast{position:absolute;left:50%;top:100px;transform:translateX(-50%);z-index:70;padding:12px 22px;border-radius:999px;background:#fff;color:#241449;font-weight:800;font-size:19px;box-shadow:var(--shadow-soft);white-space:nowrap}

/* ============ Ziffernblock ============ */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:1;grid-auto-rows:1fr}
.keypad.k5{grid-template-columns:repeat(5,1fr)}
.key{appearance:none;border:0;font-family:var(--font-math);font-weight:800;font-size:44px;color:var(--key-ink);background:var(--key-bg);border-radius:var(--r-md);min-height:64px;cursor:pointer;font-size:50px;
  box-shadow:0 7px 0 var(--key-edge),inset 0 0 0 2px rgba(170,140,255,.45),inset 0 2px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;transition:transform .07s,box-shadow .07s;font-variant-numeric:tabular-nums}
.key:active,.key.is-pressed{transform:translateY(7px);box-shadow:0 0 0 var(--key-edge),inset 0 0 0 2px rgba(170,140,255,.45)}
.key .ic{width:40px;height:40px}
.key.ok{background:linear-gradient(180deg,var(--accent-light),var(--accent));color:#0E2138;box-shadow:0 7px 0 var(--accent-dark),0 0 18px rgba(78,232,255,.6)}
.key.ok:active{box-shadow:0 0 0 var(--accent-dark)}
.key.del{color:var(--primary-light)}
.key.span2{grid-column:span 2}.key.span3{grid-column:span 3}
.keypad.off{opacity:.4;pointer-events:none}

/* ============ Mathe-Darstellung: groß, klar, kontrastreich ============ */
.eq{font-family:var(--font-math);font-weight:800;color:var(--math-ink);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;line-height:1.05;font-size:74px}
.eq.small{font-size:54px}
.eq.tiny{font-size:42px}
.eq .ln{flex-basis:100%;height:0}
.eq .word{font-size:.62em;line-height:1.15;font-family:var(--font-body);font-weight:800;hyphens:manual;-webkit-hyphens:manual;overflow-wrap:anywhere;max-width:100%;color:#FFE9FA}
.eq .unit{font-size:.62em;font-family:var(--font-body);color:var(--ink-soft)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.36em;padding:0 .2em;border-radius:18px;background:var(--math-slot);border:4px dashed rgba(255,120,210,.75);color:#fff;cursor:pointer;transition:transform .12s}
.slot.w2{min-width:4.2em}
.slot.focus{border-color:var(--primary);border-style:solid;box-shadow:0 0 0 4px rgba(255,79,184,.3),0 0 20px rgba(255,79,184,.45)}
.slot.filled{border-style:solid}
.slot.right{border-color:var(--good);background:#124A4E;border-style:solid;animation:bpop .4s}
.slot.wrong{animation:shk .45s}
.slot.opt-slot{min-width:1.3em}
.caret{display:inline-block;width:5px;height:.8em;background:var(--primary);border-radius:3px;animation:caret 1s steps(2) infinite}
@keyframes caret{50%{opacity:0}}

/* ============ Aufgaben-Bildschirm ============ */
.tp{position:absolute;z-index:6;display:flex;flex-direction:column;gap:12px;padding:22px 28px}
.tp .head{display:flex;align-items:center;gap:12px;min-height:56px}
.tp .kick{font-size:17px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.tp .grow{flex:1}
.tp .story{font-size:28px;line-height:1.36;font-weight:600;margin:0;max-width:640px}
.tp .work{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;justify-content:flex-start;position:relative;overflow:hidden}
.tp .work>:first-child{margin-top:auto}.tp .work>:last-child{margin-bottom:auto}
.wv{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.wv>.eq{flex:0 1 auto}.wv .eq{font-size:46px}
.frame-ic{width:74px;height:74px;flex:0 0 auto}
.frame-ic .shackle{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:70% 100%;transform-box:fill-box}
.frame-ic.open .shackle{transform:translateY(-12px) rotate(24deg)}
.frame-ic.open .glowme{opacity:1}
.frame-ic .glowme{opacity:0;transition:opacity .5s}
.kp{position:absolute;z-index:6;display:flex;flex-direction:column;gap:14px;padding:20px}
.helpsteps{display:flex;gap:8px;justify-content:center;align-items:center;font-size:14px;font-weight:700;color:var(--ink-soft)}
.helpsteps i{width:14px;height:14px;border-radius:50%;background:var(--ink-soft);opacity:.3}
.helpsteps i.on{opacity:1;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.opts{display:flex;flex-direction:column;gap:14px;flex:1}
.opts.row{flex-direction:row}
.opt{appearance:none;border:2px solid rgba(190,160,255,.5);background:var(--key-bg);color:#fff;border-radius:22px;font-family:var(--font-body);font-weight:800;font-size:29px;flex:1;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;box-shadow:0 7px 0 var(--key-edge);transition:transform .08s,box-shadow .08s;padding:8px}
.opt:active{transform:translateY(6px);box-shadow:0 1px 0 var(--key-edge)}
.opt .big{font-family:var(--font-math);font-size:64px;line-height:1}
.opt small{font-size:15px;color:var(--ink-soft);font-weight:700}
.opt.sel{border-color:var(--primary);box-shadow:0 7px 0 var(--primary-dark),0 0 20px rgba(255,79,184,.5)}
.opt.right{border-color:var(--good);background:linear-gradient(180deg,#1C6B63,#124A4E)}
.opt.wrong{animation:shk .45s}
.opt svg{width:100%;max-height:120px}
.viz{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.viz.fade-in{animation-duration:.6s}
.sol{font-family:var(--font-math);font-weight:800;font-size:33px;line-height:1.45;color:#fff;background:rgba(10,0,40,.35);border-radius:18px;padding:12px 18px;border:2px dashed rgba(111,242,198,.55)}
.sol div{white-space:normal}
.splitlines{font-family:var(--font-math);font-weight:800;font-size:33px;line-height:1.45;color:#fff}
.splitlines div:first-child{color:var(--accent)}
/* Malmauer */
.wall{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--font-math);font-weight:800}
.wrow{display:flex;gap:6px}
.brick{width:104px;height:62px;border-radius:10px;background:linear-gradient(180deg,#5B3AB0,#3B2380);border:2px solid rgba(190,160,255,.6);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 #1D0E48}
.brick b{font-size:34px;color:#fff}
.brick .slot{font-size:32px;height:50px;min-width:84px;border-radius:10px;border-width:3px}
/* Punktefeld */
.dots{display:grid;gap:6px;padding:12px;background:rgba(255,255,255,.06);border-radius:16px}
.dots i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#FF8AD6 45%,#B01E7E)}
.dots i.b{background:radial-gradient(circle at 35% 30%,#fff,#6FF2FF 45%,#1A9DBA)}
.dots i.x{opacity:.25}
.dots .sp{grid-column:1/-1;height:2px;background:rgba(255,255,255,.5);margin:2px 0}
/* Beutel/Gruppen */
.groups{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.bag{width:66px;min-height:90px;position:relative;display:flex;flex-direction:column;align-items:center}
.bag>svg{width:66px;height:90px}
.bag .dots2{position:absolute;left:8px;right:8px;top:34px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.bag .dots2 i{width:10px;height:10px;border-radius:3px;transform:rotate(45deg) scale(0);background:var(--gem-2);box-shadow:inset 0 2px 0 rgba(255,255,255,.6);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.bag.show .dots2 i{transform:rotate(45deg) scale(1)}
.bag .cnt{font-family:var(--font-math);font-weight:900;font-size:22px;margin-top:4px}
.rest{display:flex;gap:4px;align-items:center;font-weight:800;font-size:18px;color:var(--butter)}
.rest i{width:12px;height:12px;border-radius:3px;transform:rotate(45deg);background:var(--butter)}
/* Verteilen */
.deal{display:flex;flex-direction:column;align-items:center;gap:12px}
.deal .pile{display:flex;align-items:center;gap:10px;font-family:var(--font-math);font-weight:900;font-size:26px}
.deal .plates{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.plate{appearance:none;border:0;background:none;padding:0;position:relative;width:110px;height:92px;cursor:pointer}
.plate svg{position:absolute;inset:0;width:100%;height:100%}
.plate .on{position:absolute;left:10px;right:10px;top:8px;bottom:22px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-end;justify-content:center}
.plate .on i{width:14px;height:14px;border-radius:4px;transform:rotate(45deg);background:var(--gem-2);box-shadow:inset 0 2px 0 rgba(255,255,255,.7);animation:bpop .3s}
.plate:active{transform:scale(.95)}
/* Stellenwerttafel */
.pvt{border-collapse:separate;border-spacing:6px;font-family:var(--font-math);font-weight:800}
.pvt th{font-size:20px;color:var(--accent);padding:6px 10px;background:rgba(78,232,255,.12);border-radius:10px;min-width:62px}
.pvt td{height:110px;background:rgba(255,255,255,.06);border-radius:12px;vertical-align:middle;text-align:center;font-size:48px;min-width:62px;padding:6px}
.pvt td .tok{display:grid;grid-template-columns:repeat(3,16px);gap:4px;justify-content:center}
.pvt td .tok i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#FF8AD6 50%,#B01E7E)}
.pvt td.z .tok i{background:radial-gradient(circle at 35% 30%,#fff,#6FF2FF 50%,#1A9DBA)}
.pvt td.e .tok i{background:radial-gradient(circle at 35% 30%,#fff,#FFD66B 50%,#B07A10)}
.pvt.small th{font-size:15px;min-width:54px;padding:5px}
.pvt.small td{height:74px;font-size:40px}
/* Schriftlich */
.wr{border-collapse:separate;border-spacing:6px 4px;font-family:var(--font-math);font-weight:800;font-size:44px;margin:0 auto}
.wr td{width:58px;height:58px;text-align:center;vertical-align:middle;border-radius:10px}
.wr tr.num td.d{background:rgba(255,255,255,.05)}
.wr td.op{color:var(--accent);width:40px}
.wr tr.carry td.c{height:36px;font-size:24px;color:var(--butter);border:2px dashed rgba(255,214,107,.35);cursor:pointer}
.wr tr.carry td.c.on{border-style:solid;background:rgba(255,214,107,.15)}
.wr tr.line td{height:4px;padding:0;background:#fff;border-radius:2px}
.wr tr.line td.op{background:none}
.wr tr.res td.r{background:var(--math-slot);border:3px dashed rgba(255,120,210,.7);cursor:pointer}
.wr tr.res td.r.focus{border-style:solid;border-color:var(--primary);box-shadow:0 0 16px rgba(255,79,184,.5)}
.wr tr.res td.r.right{border-color:var(--good);background:#124A4E}
.wr.small{font-size:36px}
.wr.small td{width:48px;height:50px}
/* Zahlenstrahl, Diagramm, Formen */
.nl{width:100%;height:auto;overflow:visible;touch-action:none}
.nl .lupe{cursor:grab}
.chartsvg,.shapesvg{width:100%;height:100%;overflow:visible}
.shapewrap{height:250px;display:flex;justify-content:center}
.bodies{display:flex;gap:14px;justify-content:center}
.bodies .opt{min-height:170px;flex:0 0 170px}

/* ============ Filmszene (Geschichte) ============ */
.cut-box{position:absolute;z-index:8;padding:26px 30px;display:flex;flex-direction:column;gap:14px}
.cut-box .who{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}
.cut-box p{margin:0;font-size:31px;line-height:1.35;font-weight:600;min-height:3em}
.cut-box .row{display:flex;gap:14px;align-items:center;justify-content:space-between}
.dots-prog{display:flex;gap:8px}
.dots-prog i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots-prog i.on{background:var(--accent)}

/* ============ Start, Begleiter, Detektivin ============ */
.logo{position:absolute;z-index:6;pointer-events:none}
.logo .l-frame{border:3px solid rgba(78,232,255,.9);border-radius:26px;padding:22px 34px 26px;box-shadow:0 0 14px rgba(78,232,255,.8),inset 0 0 14px rgba(78,232,255,.5);background:rgba(20,8,50,.45)}
.logo .l-eye{display:block;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.4em;font-size:22px;color:var(--accent);text-shadow:0 0 10px var(--accent)}
.logo .l-title{display:block;font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:84px;line-height:1;letter-spacing:.05em;color:#FFEAF8;text-shadow:0 0 4px #fff,0 0 14px #FF4FB8,0 0 32px #FF4FB8,0 0 60px rgba(255,79,184,.7)}
.logo .l-title.cy{color:#E9FDFF;text-shadow:0 0 4px #fff,0 0 14px #4EE8FF,0 0 32px #4EE8FF,0 0 60px rgba(78,232,255,.6)}
.logo .ribbon{display:block;margin-top:14px;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--butter);font-weight:700;text-shadow:0 0 12px rgba(255,214,107,.7)}
.avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--paper-2);border:2px solid var(--panel-border);display:flex;align-items:flex-start;justify-content:center}
.avatar svg{width:112px;height:145px;margin-top:-26px;flex:0 0 auto}
.neon-h{position:absolute;left:0;right:0;top:94px;margin:0;text-align:center;font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:52px;color:#FFEAF8;text-shadow:0 0 4px #fff,0 0 16px #FF4FB8,0 0 36px #FF4FB8;z-index:6;pointer-events:none}
.pchoice{position:absolute;left:0;right:0;top:184px;display:flex;gap:44px;justify-content:center;z-index:6}
.pcard2{appearance:none;font-family:var(--font-body);color:var(--ink);flex:0 0 380px;height:476px;border-radius:32px;border:2px solid var(--panel-border);background:var(--panel-bg);box-shadow:var(--shadow-deep);position:relative;display:flex;flex-direction:column;align-items:center;padding:0 26px 22px;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .25s,box-shadow .25s;opacity:.72;overflow:hidden}
.pcard2.on{opacity:1;transform:translateY(-8px) scale(1.03);border-color:#FF8AD6;box-shadow:var(--shadow-deep),0 0 0 3px rgba(255,79,184,.7),0 0 44px rgba(255,79,184,.55)}
.pcard2 .stage-glow{position:absolute;left:50%;top:30px;width:320px;height:320px;margin-left:-160px;border-radius:50%;background:radial-gradient(circle,rgba(78,232,255,.3),rgba(78,232,255,0) 65%)}
.pcard2.on .stage-glow{background:radial-gradient(circle,rgba(255,120,210,.5),rgba(255,120,210,0) 65%)}
.pfig{position:relative;height:284px;width:300px;display:flex;align-items:flex-end;justify-content:center;margin-top:8px;pointer-events:none}
.pfig .char{position:relative;left:auto;top:auto}
.pname{font-family:var(--font-display);font-weight:800;font-size:44px;text-transform:uppercase;letter-spacing:.08em;color:#fff;text-shadow:0 0 12px var(--accent);line-height:1.1}
.pcard2.on .pname{text-shadow:0 0 14px #FF4FB8,0 0 30px #FF4FB8}
.pwhat{font-size:19px;font-weight:700;color:var(--ink-soft);text-align:center}
.ppower{margin-top:12px;display:flex;gap:10px;align-items:center;font-size:17px;font-weight:700;background:rgba(10,0,40,.35);padding:10px 16px;border-radius:16px;text-align:left;line-height:1.3}
.ppower .ic{width:22px;height:22px;flex:0 0 auto;color:var(--gold)}
.pcheck{position:absolute;top:16px;right:16px;width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1);box-shadow:0 0 16px rgba(255,79,184,.8)}
.pcard2.on .pcheck{transform:scale(1)}
.pcheck .ic{width:26px;height:26px}
.steps2{display:flex;gap:8px;align-items:center;height:64px;padding:0 20px;border-radius:999px;background:rgba(40,20,90,.82);border:2px solid var(--panel-border)}
.steps2 i{width:44px;height:10px;border-radius:5px;background:rgba(255,255,255,.2)}
.steps2 i.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.spot{position:absolute;z-index:1;pointer-events:none;clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(255,220,245,.34),rgba(255,220,245,.06))}
.pedestal{position:absolute;border-radius:50%;z-index:2;background:radial-gradient(ellipse at 50% 35%,#FF9ADF,#7A2E9E 58%,#2A1760);box-shadow:0 0 44px rgba(255,79,184,.65),inset 0 6px 10px rgba(255,255,255,.4)}
.lpanel{position:absolute;padding:22px 24px;display:flex;flex-direction:column;gap:12px;z-index:8}
.lrow{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:10px}
.llab{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:18px;color:var(--accent);text-shadow:0 0 10px rgba(78,232,255,.5)}
.lopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lopt{appearance:none;font-family:var(--font-body);position:relative;height:124px;border-radius:20px;border:2px solid rgba(190,160,255,.4);background:rgba(20,8,50,.5);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:transform .15s,box-shadow .2s;padding:6px}
.lopt:active{transform:scale(.94)}
.lopt.on{border-color:#FF8AD6;box-shadow:0 0 0 2px rgba(255,79,184,.6),0 0 22px rgba(255,79,184,.5);background:rgba(100,30,130,.62)}
.lopt span{font-size:14px;font-weight:700;line-height:1.1;text-align:center}
.swatch{width:60px;height:60px;border-radius:50%;box-shadow:inset 0 -5px 9px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.75)}
.thumb{width:104px;height:82px;display:block;pointer-events:none}
.thumb svg{width:100%;height:100%;display:block}
.lopt .ok{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:none;align-items:center;justify-content:center}
.lopt.on .ok{display:flex}
.lopt .ok .ic{width:16px;height:16px}

/* ============ Detektivausweis, Belohnung, Detektei ============ */
.badge-card{position:absolute;z-index:8;border-radius:30px;padding:26px 30px;background:linear-gradient(145deg,#3A1F86 0%,#27125F 55%,#3B1466 100%);border:3px solid rgba(255,214,107,.8);box-shadow:0 0 0 6px rgba(255,214,107,.15),0 0 40px rgba(255,214,107,.35),var(--shadow-deep);display:grid;grid-template-columns:220px 1fr;gap:22px;overflow:hidden}
.badge-card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
.badge-card .portrait{width:220px;height:260px;border-radius:20px;background:radial-gradient(circle at 50% 30%,#5B3AB0,#1E0F4A);border:2px solid rgba(255,255,255,.3);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.badge-card .portrait svg{width:240px;height:310px;margin-bottom:-60px;flex:0 0 auto}
.badge-card h2{margin:0;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:20px;color:var(--butter)}
.badge-card .nm{font-family:var(--font-display);font-weight:800;font-size:44px;text-transform:uppercase;letter-spacing:.04em;line-height:1.05;margin:6px 0 10px}
.badge-card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:19px}
.badge-card dt{color:var(--ink-soft);font-weight:700}
.badge-card dd{margin:0;font-weight:800}
.stamp{position:absolute;right:26px;bottom:22px;width:150px;height:150px;border-radius:50%;border:5px solid var(--primary);color:var(--primary-light);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.08em;line-height:1.15;transform:rotate(-14deg);background:rgba(255,79,184,.08);box-shadow:0 0 18px rgba(255,79,184,.5);animation:stampIn .6s .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stampIn{from{transform:rotate(-14deg) scale(2.2);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
.lockrow{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.lockrow i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1)}
.lockrow i.on{background:var(--gold);color:#3A2400}
.lockrow i .ic{width:17px;height:17px}
.rew{position:absolute;z-index:8;padding:28px 32px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.banner{font-family:var(--font-display);font-weight:800;text-transform:uppercase;color:#FFEAF8;text-shadow:0 0 6px #fff,0 0 20px #FF4FB8,0 0 44px #FF4FB8;font-size:60px;line-height:1;margin:0}
.stars3{display:flex;gap:10px;align-items:flex-end}
.stars3 svg{width:70px;height:70px;animation:starIn .6s cubic-bezier(.3,1.7,.5,1) both}
.stars3 svg:nth-child(2){width:90px;height:90px;animation-delay:.25s}
.stars3 svg:nth-child(3){animation-delay:.5s}
.stars3 svg.off{opacity:.25;filter:grayscale(1)}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.gain{display:flex;align-items:center;gap:14px;font-family:var(--font-math);font-weight:900;font-size:52px;font-variant-numeric:tabular-nums}
.gain .gem{width:54px;height:54px}
.burst{position:absolute;left:50%;top:42%;width:1500px;height:1500px;margin:-750px 0 0 -750px;z-index:3;pointer-events:none;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,120,220,.3) 0 9deg,rgba(80,230,255,0) 9deg 22deg);-webkit-mask-image:radial-gradient(circle,#000 12%,transparent 60%);mask-image:radial-gradient(circle,#000 12%,transparent 60%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hubcards{position:absolute;z-index:8;display:flex;flex-direction:column;gap:16px}
.hubcard{appearance:none;text-align:left;color:var(--ink);font-family:var(--font-body);display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:24px;border:2px solid var(--panel-border);background:var(--panel-bg);box-shadow:var(--shadow-soft);cursor:pointer;transition:transform .1s}
.hubcard:active{transform:scale(.97)}
.hubcard .ico{width:74px;height:74px;border-radius:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--primary-light),var(--primary));box-shadow:0 0 18px rgba(255,79,184,.6)}
.hubcard .ico .ic{width:40px;height:40px;color:#fff}
.hubcard.b .ico{background:linear-gradient(180deg,var(--accent-light),var(--accent));box-shadow:0 0 18px rgba(78,232,255,.6)}
.hubcard.b .ico .ic{color:#0E2138}
.hubcard.locked{opacity:.6}
.hubcard.locked .ico{background:var(--locked);box-shadow:none}
.hubcard b{display:block;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.05em;font-size:26px}
.hubcard span{font-size:20px;color:var(--ink-soft);font-weight:600}

/* ============ Eltern (schlicht und ruhig) ============ */
.par{position:absolute;inset:0;z-index:10;background:#1A1038;color:var(--ink);display:flex;flex-direction:column;font-family:var(--font-body)}
.par-head{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid #3E2A74;flex-wrap:wrap}
.par-tabs{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{white-space:nowrap}
#stage.port .par-tabs{width:100%}
.par-head h1{margin:0;font-size:28px;font-weight:800}
.par-head .grow{flex:1}
.par-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 26px 40px;touch-action:pan-y}
.pbtn{appearance:none;font-family:inherit;border:1.5px solid #3E2A74;background:#231548;color:var(--ink);min-height:52px;padding:0 18px;border-radius:14px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.pbtn .ic{width:22px;height:22px}
.pbtn:active{transform:scale(.97)}
.pbtn.dark{background:#fff;color:#1A1038;border-color:transparent}
.pbtn.lvl{min-width:52px;justify-content:center;padding:0 12px;font-variant-numeric:tabular-nums}
.pcard{background:#231548;border:1.5px solid #3E2A74;border-radius:18px;padding:16px 18px;margin-bottom:14px}
.pcard h3{margin:0 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:800}
.sk{display:grid;grid-template-columns:1fr 180px 48px auto;align-items:center;gap:12px;font-size:16px;padding:6px 0;border-bottom:1px solid rgba(62,42,116,.6)}
.sk:last-child{border-bottom:0}
.sk .bar{height:10px;border-radius:5px;background:#34225F;overflow:hidden}
.sk .bar i{display:block;height:100%;border-radius:5px}
.sk .pct{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.sk .acts{display:flex;gap:6px}
.seg{display:inline-flex;border:1.5px solid #3E2A74;border-radius:12px;overflow:hidden}
.seg button{appearance:none;border:0;background:#231548;color:var(--ink);font:inherit;font-size:15px;font-weight:700;min-height:44px;padding:0 12px;cursor:pointer}
.seg button.on{background:var(--accent);color:#0E2138}
.gate{position:absolute;inset:0;z-index:30;background:rgba(10,4,30,.85);display:flex;align-items:center;justify-content:center}
.gate .box{width:520px;padding:26px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.gate .q{font-family:var(--font-math);font-weight:800;font-size:48px;text-align:center}
textarea.code{width:100%;height:120px;border-radius:12px;background:#120A2E;color:#fff;border:1.5px solid #3E2A74;font:14px ui-monospace,Menlo,monospace;padding:10px;-webkit-user-select:text;user-select:text}

@media (prefers-reduced-motion:reduce){
  .char .idle,.blink,.wings,.twinkle,.flicker,.rise,.search i,.warm,.burst,.progress .pip.now,.caret,.badge-card::after{animation:none!important}
  .screen.enter{animation-duration:.01s}
}

/* ============ Design-Durchgang: einheitliche Kopfleiste, exakt zentrierte Beschriftungen ============ */
.topbar{height:64px}
.topbar .btn.round,.abs .btn.round{width:64px;height:64px;min-height:64px}
.topbar .btn.small,.abs .btn.small{min-height:60px;height:60px}
.topbar .chip,.abs.chip,.abs .chip,.topbar .title-chip,.topbar .progress{height:60px}
.btn,.title-chip,.chip,.key,.opt,.pbtn,.hq-tabs .t,.plate,.nbadge{line-height:1}
@supports (text-box: trim-both cap alphabetic){
  .btn,.title-chip,.chip,.hq-tabs .t,.nbadge,.pbtn{text-box:trim-both cap alphabetic}
}
.btn .ic,.title-chip .ic,.chip .ic,.pbtn .ic,.hq-tabs .t .ic{flex:0 0 auto}
.tp .story.long{font-size:23px;line-height:1.32}
#stage.port .lopt{height:106px}
#stage.port .lpanel{gap:8px;padding:18px 20px}
#stage.port .plate{width:92px;height:78px}
.deal.many .plate{width:74px;height:62px}
.deal.many .plates{gap:8px}
.deal.many .plate .on i{width:10px;height:10px}
.deal{gap:8px}

/* ============ Elternbereich: Auswertung ============ */
.par .note{margin:10px 0 0;font-size:14px;line-height:1.45;color:var(--ink-soft)}
.par .txt{margin:0;font-size:17px;line-height:1.45}
.wkrow{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(5,auto);gap:10px 26px;flex:1 1 420px}
.kpi b{display:block;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--ink-soft)}
.wk{display:flex;gap:8px;align-items:flex-end;height:120px;flex:0 0 auto}
.wkd{display:flex;flex-direction:column;align-items:center;gap:4px;width:34px;height:100%}
.wkv{font-size:12px;font-weight:800;height:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.wkb{flex:1;width:18px;display:flex;align-items:flex-end;border-bottom:2px solid #5B4A8E}
.wkb i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.wkl{font-size:12px;color:var(--ink-soft);font-weight:700}
.wkd.today .wkl{color:var(--ink)}
.rec{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rec li{display:flex;flex-direction:column;gap:2px;font-size:16px;line-height:1.35;padding:8px 12px;border-radius:12px;background:#1C1040}
.rec li span{color:var(--ink-soft);font-size:14px}
.sk2{display:grid;grid-template-columns:1fr 150px 48px 112px;align-items:center;gap:12px;font-size:16px;padding:8px 0;border-bottom:1px solid rgba(62,42,116,.6)}
.sk2:last-child{border-bottom:0}
.sk2 .nm small{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px;line-height:1.3}
.sk2 .pct{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:#34225F;overflow:hidden;display:block}
.bar.empty{background:transparent;border:1.5px dashed #5B4A8E;height:10px}
.bar i{display:block;height:100%;border-radius:5px}
.bar i.good{background:#4FB88E}.bar i.mid{background:#E6B43C}.bar i.low{background:#E36A86}
.bar i.few{opacity:.6}
.bar i.test{opacity:.75;background-image:repeating-linear-gradient(135deg,rgba(26,16,56,.55) 0 3px,transparent 3px 7px)}
.st{justify-self:start;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st.good{background:rgba(79,184,142,.18);color:#8FE6C1}.st.mid{background:rgba(230,180,60,.18);color:#F4D27E}.st.low{background:rgba(227,106,134,.18);color:#F7A3B7}
.st.none{background:rgba(255,255,255,.08);color:var(--ink-soft)}
.st.pre{background:transparent;border:1.5px dashed currentColor;padding:3px 9px}
.legend .lg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;font-size:14px;color:var(--ink-soft)}
.legend .lg>span{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}
.c-good{color:#8FE6C1}.c-mid{color:#F4D27E}.c-low{color:#F7A3B7}
#stage.port .kpis{grid-template-columns:repeat(3,auto)}
#stage.port .sk2{grid-template-columns:1fr 100px 44px 104px;gap:8px}
#stage.port .legend .lg{grid-template-columns:1fr}
.bar i.neutral{background:#8C7AC0;opacity:.7}
.bar i.neutral.test{background-color:#8C7AC0}
.sk2.sk-few .pct{color:var(--ink-soft);font-weight:600}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.bk>div{background:#1C1040;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bk b{font-size:16px}.bk span{font-size:14px;color:var(--ink-soft);line-height:1.4}
.bk .row{display:flex;gap:10px;flex-wrap:wrap}
.bk textarea.code{height:70px}
#stage.port .bk{grid-template-columns:1fr}
.pcard.hint{border-color:#6A55A0;background:#2A1A5C}.pcard.hint .txt{display:flex;gap:10px;align-items:center;font-size:16px}.pcard.hint .ic{width:24px;height:24px;flex:0 0 auto;color:var(--accent)}
.btn.off{opacity:.75}
.btn.off::after{content:"";position:absolute;left:18px;right:18px;top:50%;height:3px;border-radius:2px;background:#FF8AD6;transform:rotate(-40deg);box-shadow:0 0 0 2px rgba(29,14,72,.9)}
@media (prefers-reduced-motion:reduce){
  .pin,.csearch,.clue-card.finding .csearch,.fog.lift,.node.reveal .bld svg,.flicker,.twinkle,.rise,.wiggle,.shake,.hop,.char.hop,.pl.land{animation:none!important}
  .clue-card,.cbody,.cthink,.crow,.caught{animation-duration:.01s!important;transition:none!important}
  .zap path{animation-duration:.01s!important}
}
.toast{white-space:normal;max-width:min(680px,90%);width:max-content;text-align:center;line-height:1.3}

/* ============ Baustein 2: Fälle-Karte ============ */
.node{position:absolute;width:140px;height:176px;display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:4}
.node .bld{width:140px;height:140px;position:relative;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.node .bld svg{width:100%;height:100%;display:block;overflow:visible}
.node:active .bld{transform:scale(.92)}
.node .plate{margin-top:-8px;font-weight:800;font-size:17px;background:#2A1760;color:var(--ink);border:2px solid var(--panel-border);border-radius:999px;padding:5px 14px;white-space:nowrap;box-shadow:var(--shadow-soft);position:relative;z-index:2}
.node.locked .bld svg{filter:grayscale(1) opacity(.45)}
.node.locked .plate{color:var(--ink-soft)}
.node.sel .plate{background:var(--primary);color:#fff;border-color:transparent}
.nbadge{position:absolute;top:4px;right:0;min-width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-soft);border:3px solid #1B0F3E;z-index:3}
.nbadge .ic{width:22px;height:22px}
.nbadge.done{background:var(--gold);color:#3A2400}
.nbadge.lock{background:var(--locked);color:#fff}
.nbadge.new{background:var(--accent);color:#0E2138;font-weight:900;font-size:14px;padding:0 10px}
.nbadge.soon{background:#6A55A0;color:#fff;font-weight:900;font-size:13px;padding:0 10px}
.pin{position:absolute;top:-58px;left:50%;margin-left:-28px;width:56px;height:70px;animation:pinB 1.4s ease-in-out infinite;z-index:3}
@keyframes pinB{50%{transform:translateY(-10px)}}
.fog{position:absolute;left:-16px;right:-16px;top:40px;height:90px;pointer-events:none;opacity:.9}
.info{position:absolute;padding:24px 26px;display:flex;flex-direction:column;gap:12px;z-index:8}
.info .kicker{font-size:16px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.info h2{margin:0;font-family:var(--font-display);font-size:30px;line-height:1.08;text-transform:uppercase;letter-spacing:.03em;color:var(--ink);text-wrap:balance}
.info p{margin:0;font-size:21px;line-height:1.38;color:var(--ink-soft)}
.info .sub{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.suspects{display:flex;gap:10px}
.suspect{width:92px;height:106px;border-radius:18px;background:var(--paper-2);border:2px solid var(--panel-border);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.suspect .char{position:relative;left:auto;top:auto;margin-bottom:-6px}
.suspect small{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:12px;font-weight:800;background:#241449;color:var(--ink);padding:3px 0;line-height:1.1}
.cluepips{display:flex;gap:8px;align-items:center;font-weight:700;font-size:18px}
.cluepips i{width:28px;height:28px;border-radius:50%;background:var(--paper-2);border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--locked)}
.cluepips i.on{background:var(--gold);border-color:transparent;color:#3A2400}
.cluepips i .ic{width:16px;height:16px}
.info .btn{margin-top:auto}
.info.swap{animation:fadeIn .35s both}

/* ============ Filmszene mit mehreren Figuren ============ */
.cast{position:absolute;z-index:6;pointer-events:none}
.cast .char{pointer-events:auto;transition:filter .3s,opacity .3s}
.cast .char.quiet{filter:brightness(.6) saturate(.8)}
.placebadge{position:absolute;z-index:4;width:210px;height:210px;opacity:.9;pointer-events:none}
.placebadge svg{width:100%;height:100%;overflow:visible}
.placename{position:absolute;z-index:5;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.1em;font-weight:800;font-size:18px;color:var(--butter);text-shadow:0 0 10px rgba(255,214,107,.6)}

/* ============ Hinweis-Karte ============ */
.clue-ov{position:absolute;inset:0;z-index:58;background:rgba(10,4,30,.62);display:flex;align-items:center;justify-content:center;animation:fadeIn .3s both}
.clue-card{width:620px;max-width:calc(100% - 48px);padding:28px 30px;display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;border-radius:30px;background:linear-gradient(145deg,#3A1F86,#27125F);border:3px solid rgba(255,214,107,.8);box-shadow:0 0 40px rgba(255,214,107,.35),var(--shadow-deep);animation:cardIn .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes cardIn{from{transform:rotateY(80deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
.clue-card .ci{width:150px;height:150px;border-radius:24px;background:radial-gradient(circle,#5B3AB0,#1E0F4A);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.clue-ic{width:110px;height:110px}
.clue-card .k{font-size:16px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--butter)}
.clue-card h3{margin:6px 0 8px;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.04em;font-size:30px;line-height:1.05}
.clue-card p{margin:0 0 16px;font-size:23px;line-height:1.38}
.clue-card.mys{border-color:rgba(111,242,255,.8);box-shadow:0 0 40px rgba(111,242,255,.4),var(--shadow-deep)}

/* ============ Wer war es? ============ */
.board{position:absolute;z-index:6;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.board h3{margin:0;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:800}
.cmini{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:8px 12px;border-radius:16px;background:rgba(10,0,40,.35);border:2px solid transparent;transition:border-color .3s,box-shadow .3s}
.cmini .clue-ic{width:48px;height:48px}
.cmini b{display:block;font-size:17px;line-height:1.15}
.cmini span{font-size:15px;line-height:1.3;color:var(--ink-soft)}
.cmini.hl{border-color:var(--butter);box-shadow:0 0 18px rgba(255,214,107,.5)}
.suspects-big{position:absolute;z-index:7;display:flex;gap:18px}
.scard{appearance:none;font-family:var(--font-body);color:var(--ink);flex:1;border-radius:26px;border:2px solid var(--panel-border);background:var(--panel-bg);box-shadow:var(--shadow-soft);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px 10px 14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,opacity .3s,filter .3s}
.scard:active{transform:scale(.96)}
.scard .fig{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.scard .fig .char{position:relative;left:auto;top:auto}
.scard b{font-size:19px;line-height:1.15;text-align:center}
.scard small{font-size:14px;color:var(--ink-soft);text-align:center}
.scard.no{filter:grayscale(.9);opacity:.5}
.scard.no::after{content:"✕";position:absolute;top:10px;right:14px;font-size:36px;font-weight:900;color:#FF8AA8}
.scard.yes{border-color:var(--good);box-shadow:0 0 0 3px rgba(111,242,198,.6),0 0 40px rgba(111,242,198,.5)}
.caught{position:absolute;left:50%;top:40%;z-index:59;transform:translate(-50%,-50%) rotate(-10deg);border:6px solid var(--primary);color:#fff;background:rgba(255,79,184,.25);border-radius:22px;padding:14px 30px;font-family:var(--font-display);font-weight:800;font-size:64px;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 20px #FF4FB8;animation:stampIn2 .5s cubic-bezier(.3,1.6,.5,1) both;pointer-events:none}
@keyframes stampIn2{from{transform:translate(-50%,-50%) rotate(-10deg) scale(2.4);opacity:0}to{transform:translate(-50%,-50%) rotate(-10deg) scale(1);opacity:1}}

/* ============ Fall gelöst ============ */
.unlocks{display:flex;gap:14px;width:100%;justify-content:center;flex-wrap:wrap}
.unlock{flex:1;min-width:230px;padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left}
.unlock .art{width:70px;height:84px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center}
.unlock .art svg{width:100%;height:100%;overflow:visible}
.unlock b{display:block;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.unlock span{font-size:20px;font-weight:800;line-height:1.15}
.cliff{position:absolute;z-index:7;padding:18px 22px;background:#FFFDF2;color:#3A2A48;font-size:21px;line-height:1.38;border-radius:8px;box-shadow:0 12px 26px rgba(0,0,0,.3);transform:rotate(2deg);font-weight:600}
.cliff::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-40px;width:80px;height:24px;background:rgba(255,190,220,.8);transform:rotate(-4deg)}
.cliff b{display:block;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#C24A85;margin-bottom:6px}

/* ============ Hauptquartier ============ */
.room{position:absolute;inset:0;z-index:1}
.room>svg{position:absolute;inset:0;width:100%;height:100%}
.pl{position:absolute;pointer-events:none;transform-origin:50% 100%;transition:transform .15s}
.pl svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.pl svg *{pointer-events:visiblePainted}
.pl.sel{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px var(--primary))}
.pl.drag{transform:scale(1.07) translateY(-8px);transition:none}
.pl.flip svg{transform:scaleX(-1)}
.pl.land{animation:land .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:scale(1.08,.9)}60%{transform:scale(.97,1.04)}100%{transform:none}}
.pl .char,.pl .idle{pointer-events:none}
.hq-bar{position:absolute;padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px;z-index:20}
.hq-tabs{display:flex;gap:8px;align-items:center}
.hq-tabs .t{height:44px;padding:0 18px;border-radius:999px;font-weight:800;font-size:18px;background:var(--paper-2);color:var(--ink);display:flex;align-items:center;gap:8px;border:0;font-family:inherit;cursor:pointer}
.hq-tabs .t.on{background:var(--primary);color:#fff}
.hq-tabs .t .ic{width:20px;height:20px}
.hq-tabs .hint{margin-left:auto;font-size:16px;color:var(--ink-soft);font-weight:700;display:flex;align-items:center;gap:6px}
.hq-tabs .hint .ic{width:22px;height:22px}
.shelf{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;touch-action:pan-x}
.shelf::-webkit-scrollbar{display:none}
.itemcard{flex:0 0 118px;height:108px;border-radius:18px;background:#2A1760;border:2px solid var(--panel-border);position:relative;display:flex;align-items:center;justify-content:center;touch-action:pan-x;cursor:grab;transition:transform .12s;padding-bottom:20px}
.itemcard:active{transform:scale(.95)}
.itemcard .art{width:80px;height:70px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.itemcard .art svg{max-width:100%;max-height:100%;overflow:visible}
.itemcard .price{position:absolute;bottom:5px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.itemcard .price .gem{width:18px;height:18px}
.itemcard .have{position:absolute;top:6px;right:6px;min-width:30px;height:30px;border-radius:15px;background:var(--accent);color:#0E2138;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.itemcard.armed{box-shadow:0 0 0 4px var(--primary),var(--glow)}
.itemcard.locked{opacity:.55;cursor:default}
.itemcard .lk{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:var(--locked);color:#fff;display:flex;align-items:center;justify-content:center}
.itemcard .lk .ic{width:16px;height:16px}
.selmenu{position:absolute;z-index:30;display:flex;gap:8px;padding:10px;border-radius:24px;transform:translateX(-50%)}
.selmenu button{appearance:none;border:0;background:var(--paper-2);color:var(--ink);font-family:inherit;min-width:92px;height:78px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:15px;cursor:pointer;transition:transform .08s}
.selmenu button:active{transform:scale(.93)}
.selmenu button .ic{width:28px;height:28px}
.selmenu button.ok{background:var(--accent);color:#0E2138}
.ghost{position:absolute;z-index:50;pointer-events:none;opacity:.9;transform-origin:50% 100%}
.ghost svg{width:100%;height:100%;overflow:visible}
.buy{position:absolute;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;max-width:calc(100% - 48px);padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;animation:fadeIn .3s both}
.buy .art{width:140px;height:140px;display:flex;align-items:flex-end;justify-content:center}
.buy .art svg{max-width:100%;max-height:100%;overflow:visible}
.buy p{margin:0;font-size:24px;line-height:1.35;font-weight:700}
.buy .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ============ Ergänzungen Baustein 2 ============ */
.info .suspect{width:84px;height:100px}
.suspect small{z-index:8}
.node .plate{width:max-content}
.info h2{font-size:25px}
.info p{font-size:18px;line-height:1.35}
.info .itop,.info .imid{display:flex;flex-direction:column;gap:8px}
.info .ibot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.info .ibot .btn{margin-top:0}
.info.port{display:grid;grid-template-columns:1fr 290px;grid-template-rows:1fr auto;column-gap:26px;row-gap:14px;padding:20px 24px}
.info.port .itop{grid-column:1;grid-row:1}
.info.port .imid{grid-column:2;grid-row:1}
.info.port .ibot{grid-column:1/3;grid-row:2;flex-direction:row;align-items:center}
.info.port .ibot .maptip{flex:1}
.info.port .ibot .btn{flex:0 0 auto}
.info.port .itop.full{grid-column:1/3}
.info .cluepips span{font-size:16px;color:var(--ink-soft);margin-left:4px}
.minis{grid-column:2}
.info.port .sub{grid-row:1}.info.port .suspects{grid-row:2}.info.port .cluepips{grid-row:3;align-self:start}.info.port .minis{grid-row:1/3}
.info.port .maptip{grid-column:1;grid-row:4}
.info.port .btn{grid-column:2;grid-row:4;margin-top:0;align-self:end}
.info .cluepips span{font-size:16px;color:var(--ink-soft);margin-left:4px}
.minis{display:flex;gap:6px}.minis svg{width:48px;height:48px}.minis svg.off{opacity:.25;filter:grayscale(1)}
.maptip{display:flex;gap:10px;align-items:center;font-size:17px;line-height:1.3;font-weight:600;color:var(--ink);background:rgba(10,0,40,.4);border-radius:18px;padding:8px 14px 8px 6px;border:1px solid rgba(255,255,255,.12)}
.maptip .av{flex:0 0 64px;width:64px;height:64px;border-radius:50%;overflow:hidden;background:radial-gradient(circle,#5B3AB0,#241449);position:relative}
.maptip .av .char{position:absolute;left:-10px!important;top:-2px!important;pointer-events:none}
.fog.lift{animation:fogOut 1.8s .4s ease-in forwards}
@keyframes fogOut{to{opacity:0;transform:translateY(-40px) scale(1.4)}}
.node.reveal .bld svg{animation:revealB 1.6s .3s both}
@keyframes revealB{from{filter:grayscale(1) opacity(.45)}to{filter:none}}
.cast .char.speaking{filter:drop-shadow(0 0 18px rgba(255,214,107,.45))}
.itemcard.used{opacity:.6}
.itemcard .price{font-size:15px}
.buy-wrap{position:absolute;inset:0;z-index:60;background:rgba(10,4,30,.55);animation:fadeIn .25s both}
.trophies{position:absolute;z-index:2;display:flex;gap:12px;pointer-events:none}
.trophy{width:74px;height:96px;border-radius:10px;background:#1A0F3A;border:4px solid #5B3C9A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.trophy.on{border-color:var(--gold);box-shadow:0 0 18px rgba(255,214,107,.35),0 6px 14px rgba(0,0,0,.35)}
.trophy .tb{width:54px;height:54px;display:flex;align-items:center;justify-content:center}

<body>
<div id="app"></div>
<script>
/* ===== 10-util.js ===== */
/* =====================================================================
   HILFSFUNKTIONEN (Zufall, Zahlen schreiben, Zahlwörter)
   ===================================================================== */
const RND = {
  int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: arr => arr[Math.floor(Math.random() * arr.length)],
  chance: p => Math.random() < p,
  shuffle: arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
};

/* Zahlen wie in der Schule: ab 10 000 mit schmalem Abstand (34 000), darunter ohne (4000) */
function fmt(n){
  const s = String(n);
  if (Math.abs(n) < 10000) return s;
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

/* Zahlwörter 0 … 999 999 (deutsche Rechtschreibung) */
function zahlwort(n){
  const e = ['null', 'eins', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht', 'neun', 'zehn', 'elf', 'zwölf', 'dreizehn', 'vierzehn', 'fünfzehn', 'sechzehn', 'siebzehn', 'achtzehn', 'neunzehn'];
  const z = ['', '', 'zwanzig', 'dreißig', 'vierzig', 'fünfzig', 'sechzig', 'siebzig', 'achtzig', 'neunzig'];
  const u100 = x => { if (x < 20) return e[x]; const t = Math.floor(x / 10), u = x % 10; return (u ? (u === 1 ? 'ein' : e[u]) + 'und' : '') + z[t]; };
  const u1000 = x => { const h = Math.floor(x / 100), r = x % 100; return (h ? (h === 1 ? 'ein' : e[h]) + 'hundert' : '') + (r ? u100(r) : ''); };
  if (n === 0) return 'null';
  const t = Math.floor(n / 1000), r = n % 1000;
  let s = '';
  if (t) s += (t === 1 ? 'ein' : u1000(t).replace(/eins$/, 'ein')) + 'tausend';
  if (r) s += u1000(r);
  return s;
}
/* Zahlwort mit weichen Trennstellen, damit lange Wörter umbrechen können */
function zahlwortSoft(n){ return zahlwort(n).replace(/tausend(?=.)/, 'tausend­').replace(/hundert(?=.)/g, 'hundert­'); }

/* Ziffern-Dreher: 56 ↔ 65 */
function isDreher(v, c){ const a = String(v), b = String(c); return a.length > 1 && a !== b && a.split('').reverse().join('') === b; }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ===== 20-skills.js ===== */
/* =====================================================================
   KOMPETENZSTRUKTUR (Datenstruktur, leicht erweiterbar)
   cat: 'mul' = Mal und Geteilt (Kl. 3, Schwerpunkt ~50 %)
        'k3'  = übrige Inhalte Klasse 3 (~30 %)
        'k4'  = neu aus Klasse 4 (~20 %, erst nach Freischaltung)
   pre: Voraussetzungen. gate: Mindest-Beherrschung der Voraussetzungen (nur k4 hart).
   off: true = standardmäßig ausgeschaltet (z. B. spätere Themen)
   ===================================================================== */
const SKILLS = [
  { id: 'm_kern', cat: 'mul', name: 'Kernaufgaben (1·, 2·, 5·, 10·)', short: 'Kernaufgaben', pre: [] },
  { id: 'm_reihe_346', cat: 'mul', name: 'Einmaleins 3er, 4er, 6er', short: '3er, 4er, 6er', pre: ['m_kern'] },
  { id: 'm_reihe_789', cat: 'mul', name: 'Einmaleins 7er, 8er, 9er', short: '7er, 8er, 9er', pre: ['m_reihe_346'] },
  { id: 'm_ableiten', cat: 'mul', name: 'Ableiten: Nachbar- und Verdopplungsaufgaben', short: 'Ableiten', pre: ['m_kern'] },
  { id: 'd_kern', cat: 'mul', name: 'Geteilt: Kernaufgaben (:2, :5, :10)', short: 'Geteilt-Kern', pre: ['m_kern'] },
  { id: 'd_alle', cat: 'mul', name: 'Einsdurcheins, alle Reihen', short: 'Einsdurcheins', pre: ['d_kern', 'm_reihe_346'] },
  { id: 'm_platz', cat: 'mul', name: 'Umkehr- und Platzhalteraufgaben (7 · ▢ = 56)', short: 'Umkehraufgaben', pre: ['d_kern'] },
  { id: 'm_zehner', cat: 'mul', name: 'Mal und Geteilt mit Zehner- und Hunderterzahlen', short: 'Zehnerzahlen', pre: ['m_reihe_346'] },
  { id: 'm_halb', cat: 'mul', name: 'Halbschriftlich multiplizieren bis 1000', short: 'Halbschriftlich ·', pre: ['m_zehner'] },
  { id: 'd_halb', cat: 'mul', name: 'Halbschriftlich dividieren bis 1000', short: 'Halbschriftlich :', pre: ['m_zehner', 'd_alle'] },
  { id: 'd_rest', cat: 'mul', name: 'Division mit Rest', short: 'Mit Rest', pre: ['d_alle'] },
  { id: 'm_sach', cat: 'mul', name: 'Sachaufgaben zu Mal und Geteilt', short: 'Sachaufgaben', pre: ['d_kern'] },
  { id: 'm_knobel', cat: 'mul', name: 'Knobeln: Malmauern, Zahlenrätsel, Rechenketten', short: 'Knobeln', pre: ['m_reihe_346', 'm_platz'] },

  { id: 'z_stellen', cat: 'k3', name: 'Zahlen bis 1000: Stellenwerte, lesen, schreiben', short: 'Stellenwerte bis 1000', pre: [] },
  { id: 'z_ordnen', cat: 'k3', name: 'Zahlen bis 1000: vergleichen, Zahlenstrahl, runden', short: 'Zahlenstrahl bis 1000', pre: ['z_stellen'] },
  { id: 'as_kopf', cat: 'k3', name: 'Plus und Minus bis 1000 (im Kopf, halbschriftlich)', short: 'Plus/Minus bis 1000', pre: ['z_stellen'] },
  { id: 'as_schr', cat: 'k3', name: 'Schriftlich addieren und subtrahieren bis 1000', short: 'Schriftlich bis 1000', pre: ['as_kopf'] },
  { id: 'groessen', cat: 'k3', name: 'Größen: Geld, Längen, Gewicht, Zeit', short: 'Größen', pre: [] },
  { id: 'geo', cat: 'k3', name: 'Geometrie: Körper, Symmetrie, Fläche, Muster', short: 'Geometrie', pre: [] },
  { id: 'daten', cat: 'k3', name: 'Daten und Diagramme', short: 'Diagramme', pre: [] },

  { id: 'mio_stellen', cat: 'k4', name: 'Zahlen bis 1 Million: Stellenwerte, lesen, schreiben', short: 'Stellenwerte bis 1 Mio.', pre: ['z_stellen', 'z_ordnen'], gate: .55 },
  { id: 'mio_ordnen', cat: 'k4', name: 'Zahlen bis 1 Million: vergleichen, Zahlenstrahl, runden', short: 'Zahlenstrahl bis 1 Mio.', pre: ['mio_stellen'], gate: .5 },
  { id: 'mio_add', cat: 'k4', name: 'Addition bis 1 Million (im Kopf, halbschriftlich)', short: 'Plus bis 1 Mio.', pre: ['mio_stellen', 'as_kopf'], gate: .5 },
  { id: 'mio_schr', cat: 'k4', name: 'Schriftliche Addition bis 1 Million', short: 'Schriftlich plus bis 1 Mio.', pre: ['mio_stellen', 'as_schr'], gate: .5 }
  /* Später ergänzbar, standardmäßig aus (Beispiel):
     { id: 'm_schr', cat: 'k4', name: 'Schriftliche Multiplikation', pre: ['m_halb'], gate: .7, off: true } */
];
const SKILL = Object.fromEntries(SKILLS.map(s => [s.id, s]));
/* Anspruch (Elternbereich): verschiebt die Schwierigkeit nach oben */
const LEVELS = [{ n: 'Normal', add: 0 }, { n: 'Etwas mehr', add: .14 }, { n: 'Knifflig', add: .28 }];
const CATS = { mul: { name: 'Mal und Geteilt · Klasse 3', share: .5 }, k3: { name: 'Weitere Themen · Klasse 3', share: .3 }, k4: { name: 'Neu aus Klasse 4', share: .2 } };

/* Typische Fehlermuster (für Elternbereich und gezielte Hinweise) */
const PATTERNS = {
  plus_statt_mal: 'Plus statt Mal gerechnet',
  mal_statt_geteilt: 'Mal und Geteilt vertauscht',
  nachbar: 'Eine Reihe daneben (z. B. 7 · 8 = 63)',
  dreher: 'Zahlendreher (56 ↔ 65)',
  null: 'Null vergessen oder zu viel (3 · 40)',
  rest_gross: 'Rest größer als der Teiler',
  rest_vergessen: 'Rest vergessen',
  aufrunden: 'Bei Sachaufgaben nicht aufgerundet',
  uebertrag: 'Übertrag vergessen',
  stellenwert: 'Stellenwertfehler (Ziffer an falscher Stelle)',
  um_eins: 'Um eins verzählt',
  einheit: 'Einheiten nicht umgerechnet',
  richtung: 'Zeichen < und > vertauscht'
};

/* ===== 30-gen.js ===== */
/* =====================================================================
   AUFGABENGENERATOREN
   Jeder Generator liefert unendlich viele Varianten. Ergebnisse werden
   immer aus den Zahlen berechnet (Geteilt-Aufgaben rückwärts aus Quotient
   und Teiler gebaut), damit sie garantiert stimmen.
   Aufgabe = { skill, diff, kind, frame, title, story, parts|q, ans, hints[4],
               viz, solution[], diagnose(inp), nums[], ops[] }
   kind: eq (Gleichung mit Lücken) · choice (Auswahl) · written (schriftlich)
         line (Zahlenstrahl) · deal (Verteilen) · pv (Stellenwerttafel)
         chart (Diagramm) · shape (Geometrie-Auswahl mit Bild)
   ===================================================================== */
const MUL = '·', DIV = ':';
const FRAMES = [
  { k: 'schloss', name: 'Zahlenschloss', intros: ['Das Zahlenschloss springt nur mit der richtigen Zahl auf.', 'Eine verschlossene Schatulle! Die richtige Zahl öffnet sie.', 'Hinter dieser Tür liegt ein Hinweis. Knack das Schloss!'] },
  { k: 'code', name: 'Geheimcode', intros: ['Auf dem Zettel steht ein Geheimcode. Welche Zahl fehlt?', 'Eine geheime Nachricht! Eine Zahl ist verwischt.', 'Der Code ist fast entschlüsselt. Nur eine Zahl fehlt noch.'] },
  { k: 'spruch', name: 'Zauberspruch', intros: ['Der Zauberspruch wirkt nur, wenn die Rechnung stimmt.', 'Die Zauberformel leuchtet erst, wenn alles richtig ist.', 'Sprich den Zauber! Dafür brauchst du das richtige Ergebnis.'] },
  { k: 'spur', name: 'Spurensuche', intros: ['Die Spur führt weiter, wenn du die Zahl findest.', 'Unter der Lupe erscheint eine Rechnung. Was kommt heraus?', 'Frische Fußspuren! Die Zahl verrät, wohin sie führen.'] }
];
const STUFF = [
  { pl: 'Glitzerkristalle', box: { pl: 'Beutel', dat: 'Beuteln', akk1: 'jeden Beutel', dat1: 'jedem Beutel', p: 'in', verb: 'sind', pack: 'in Beutel gepackt' } },
  { pl: 'Cupcakes', box: { pl: 'Teller', dat: 'Tellern', akk1: 'jeden Teller', dat1: 'jedem Teller', p: 'auf', verb: 'liegen', pack: 'auf Teller gelegt' } },
  { pl: 'Zaubertränke', box: { pl: 'Kisten', dat: 'Kisten', akk1: 'jede Kiste', dat1: 'jeder Kiste', p: 'in', verb: 'sind', pack: 'in Kisten gepackt' } },
  { pl: 'Sternbonbons', box: { pl: 'Gläser', dat: 'Gläsern', akk1: 'jedes Glas', dat1: 'jedem Glas', p: 'in', verb: 'sind', pack: 'in Gläser gefüllt' } },
  { pl: 'Wolkenmöhren', box: { pl: 'Körbe', dat: 'Körben', akk1: 'jeden Korb', dat1: 'jedem Korb', p: 'in', verb: 'liegen', pack: 'in Körbe gelegt' } },
  { pl: 'Zauberbücher', box: { pl: 'Regalbretter', dat: 'Regalbrettern', akk1: 'jedes Regalbrett', dat1: 'jedem Regalbrett', p: 'auf', verb: 'stehen', pack: 'auf Regalbretter gestellt' } },
  { pl: 'Hinweiszettel', box: { pl: 'Mappen', dat: 'Mappen', akk1: 'jede Mappe', dat1: 'jeder Mappe', p: 'in', verb: 'sind', pack: 'in Mappen gesteckt' } }
];
const cap = x => x[0].toUpperCase() + x.slice(1);
/* Fälle können ein Thema vorgeben (z. B. Cupcakes im Café) */
let GEN_STUFF = null;
function pickStuff(){ const pref = GEN_STUFF && STUFF.find(s => s.pl === GEN_STUFF); return pref && RND.chance(.65) ? pref : RND.pick(STUFF); }
const ENC = ['Du schaffst das! Lass dir ruhig Zeit.', 'Echte Detektivinnen denken kurz nach. Du hast alle Zeit der Welt.', 'Nur Mut, du bist ganz nah dran!', 'Tief durchatmen. Wir knacken das zusammen!'];

const tx = s => ({ t: String(s) });
const nm = v => ({ t: fmt(v), num: v });
const slot = (k, w) => ({ slot: k, w });
const br = { br: true };

function frameFor(){ return RND.pick(FRAMES); }
function base(skill, diff, o){
  const f = o.frame ? FRAMES.find(x => x.k === o.frame) : frameFor();
  const task = Object.assign({ skill, diff, kind: 'eq', frame: f.k, title: f.name, story: RND.pick(f.intros), ops: [], nums: [], hints: [], solution: [] }, o);
  task.frame = f.k; task.title = o.title || f.name; task.genericStory = !o.story;
  task.key = skill + '|' + JSON.stringify([task.parts, task.q, task.ans]) + '|' + (task.story || '');
  return task;
}
const enc = extra => extra ? RND.pick(ENC) + ' ' + extra : RND.pick(ENC);

/* ---------- Diagnose-Bausteine ---------- */
function diagCommon(v, c){
  if (isDreher(v, c)) return { p: 'dreher', msg: `Fast! Schau genau hin: Die Ziffern sind vertauscht.` };
  if (c !== 0 && (v === c * 10 || v * 10 === c)) return { p: 'null', msg: 'Ganz nah dran! Achte auf die Null.' };
  if (Math.abs(v - c) === 1) return { p: 'um_eins', msg: 'Nur ein kleines Stück daneben. Prüf es nochmal!' };
  return null;
}

/* ---------- Mal-Aufgaben aus dem Einmaleins ---------- */
function kernHint(k, r){
  if (![1, 2, 5, 10].includes(k) && [2, 5, 10].includes(r)){
    if (r === 2) return `Mal 2 heißt verdoppeln: ${k} + ${k}.`;
    if (r === 5) return `Mal 5 ist die Hälfte von mal 10: ${k} ${MUL} 10 = ${k * 10}, davon die Hälfte.`;
    return `Mal 10: Hänge an die ${k} eine Null an.`;
  }
  // k = Anzahl, r = Reihe. Nächste Kernaufgabe finden (1, 2, 5, 10)
  if ([1, 2, 5, 10].includes(k)){
    if (k === 1) return `Mal 1: Die Zahl bleibt gleich.`;
    if (k === 2) return `Mal 2 heißt verdoppeln: ${r} + ${r}.`;
    if (k === 5) return `Mal 5 ist die Hälfte von mal 10: 10 ${MUL} ${r} = ${10 * r}, davon die Hälfte.`;
    return `Mal 10: Hänge an die ${r} eine Null an.`;
  }
  const k0 = k <= 3 ? 2 : k <= 7 ? 5 : 10, dk = k - k0;
  return dk > 0 ? `Nimm die Kernaufgabe ${k0} ${MUL} ${r} = ${k0 * r}. Dann noch ${dk} ${MUL} ${r} dazu.` : `Nimm die Kernaufgabe ${k0} ${MUL} ${r} = ${k0 * r}. Dann ${-dk} ${MUL} ${r} weg.`;
}
function kernSteps(k, r){
  if (![1, 2, 5, 10].includes(k) && [2, 5, 10].includes(r)){
    if (r === 2) return [`${k} + ${k} = ${2 * k}`];
    if (r === 5) return [`${k} ${MUL} 10 = ${10 * k}`, `Die Hälfte von ${10 * k} ist ${5 * k}`];
    return [`${k} ${MUL} 10 = ${10 * k}`];
  }
  if ([1, 2, 5, 10].includes(k)) return [`${k} ${MUL} ${r} = ${k * r}`];
  const k0 = k <= 3 ? 2 : k <= 7 ? 5 : 10, dk = k - k0;
  return dk > 0 ? [`${k0} ${MUL} ${r} = ${k0 * r}`, `${dk} ${MUL} ${r} = ${dk * r}`, `${k0 * r} + ${dk * r} = ${k * r}`] : [`${k0} ${MUL} ${r} = ${k0 * r}`, `${-dk} ${MUL} ${r} = ${-dk * r}`, `${k0 * r} − ${-dk * r} = ${k * r}`];
}
function mulTask(skill, diff, k, r, swap){
  const c = k * r, [x, y] = swap ? [r, k] : [k, r];
  return base(skill, diff, {
    parts: [nm(x), tx(MUL), nm(y), tx('='), slot('a')], ans: { a: c }, nums: [k, r, c], ops: ['*'],
    hints: [enc(swap ? `Tipp: ${x} ${MUL} ${y} ist dasselbe wie ${y} ${MUL} ${x}.` : ''), kernHint(k, r), `Schau aufs Punktefeld: ${k} Reihen mit je ${r} Punkten.`, 'So geht es:'],
    viz: { type: 'dots', rows: k, cols: r, split: [1, 2, 5, 10].includes(k) ? 0 : (k <= 3 ? 2 : k <= 7 ? 5 : 10) },
    solution: [...kernSteps(k, r), `Also: ${x} ${MUL} ${y} = ${c}`],
    diagnose: i => { const v = i.a;
      if (v === k + r) return { p: 'plus_statt_mal', msg: `Hier wird nicht plus gerechnet. ${x} ${MUL} ${y} heißt: ${k}-mal die ${r}.` };
      if (v === c + r || v === c - r) return { p: 'nachbar', msg: `Ganz nah! Du bist eine Reihe daneben. Zähl nochmal: ${k}-mal die ${r}.` };
      if (v === c + k || v === c - k) return { p: 'nachbar', msg: `Ganz nah! Du bist eine Reihe daneben. Prüf nochmal mit einer Kernaufgabe.` };
      return diagCommon(v, c); }
  });
}
function divTask(skill, diff, dvd, dvs){
  const q = dvd / dvs;
  return base(skill, diff, {
    parts: [nm(dvd), tx(DIV), nm(dvs), tx('='), slot('a')], ans: { a: q }, nums: [dvd, dvs, q], ops: ['/'],
    hints: [enc('Denk an die passende Mal-Aufgabe.'), `Umkehraufgabe: ${dvs} ${MUL} ▢ = ${dvd}. Welche Zahl passt?`, `Schau: ${dvd} Kristalle gerecht auf ${dvs} Beutel verteilt.`, 'So geht es:'],
    viz: { type: 'groups', k: dvs, per: q, rest: 0 },
    solution: [`${dvs} ${MUL} ${q} = ${dvd}`, `Also: ${dvd} ${DIV} ${dvs} = ${q}`],

/* ---------- Prüfung: Ausschlüsse werden technisch erzwungen ---------- */
function validateTask(tk){
  const errs = [];
  const nums = (tk.nums || []).concat(Object.values(tk.ans || {}).filter(v => typeof v === 'number'));
  if (nums.some(v => !Number.isInteger(v) || v < 0)) errs.push('keine ganze Zahl oder negativ');
  if (nums.some(v => v > 1000000)) errs.push('über 1 Million');
  if (tk.ops.includes('-') && nums.some(v => v > 1000)) errs.push('Minus über 1000');
  if ((tk.ops.includes('*') || tk.ops.includes('/')) && nums.some(v => v > 1000)) errs.push('Mal/Geteilt über 1000');
  if (tk.kind === 'written' && !['+', '-'].includes(tk.q.op)) errs.push('schriftlich Mal/Geteilt');
  if (tk.kind === 'written' && tk.q.op === '-' && (tk.q.a > 1000)) errs.push('schriftlich Minus über 1000');
  if (SKILL[tk.skill].cat === 'k4' && tk.ops.some(o => o !== '+')) errs.push('Klasse 4 nur Addition');
  if (tk.ans && 'r' in tk.ans && tk.nums[1] && tk.ans.r >= tk.nums[1] && tk.skill === 'd_rest') errs.push('Rest zu groß');
  return errs;
}
function generate(skill, diff, avoid){
  for (let i = 0; i < 40; i++){
    const tk = GEN[skill](diff);
    if (validateTask(tk).length) continue;
    if (avoid && avoid.includes(tk.key)) continue;
    return tk;
  }
  return GEN[skill](diff);
}

}

}

/* ---------- Isometrie-Helfer (Stil C: Puppenhaus/Diorama) ---------- */
const C30 = Math.cos(Math.PI / 6);
function isoP(x, y, z, u, ox, oy){ return [ox + (x - y) * C30 * u, oy + (x + y) * .5 * u - z * u]; }
function isoPts(arr, u, ox, oy){ return arr.map(([x, y, z]) => isoP(x, y, z, u, ox, oy).map(n => n.toFixed(1)).join(',')).join(' '); }
function isoBox(x, y, z, w, d, h, u, ox, oy, fill, o = {}){
  const top = isoPts([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], u, ox, oy);
  const right = isoPts([[x + w, y, z + h], [x + w, y + d, z + h], [x + w, y + d, z], [x + w, y, z]], u, ox, oy);
  const left = isoPts([[x, y + d, z + h], [x + w, y + d, z + h], [x + w, y + d, z], [x, y + d, z]], u, ox, oy);
  const s = `style="fill:${fill};stroke:${fill};stroke-width:1.2;stroke-linejoin:round"`;
  return `<g>${o.noLeft ? '' : `<polygon points="${left}" ${s}/><polygon points="${left}" fill="#3A1A10" opacity="${o.ld ?? .12}"/>`}${o.noRight ? '' : `<polygon points="${right}" ${s}/><polygon points="${right}" fill="#3A1A10" opacity="${o.rd ?? .26}"/>`}${o.noTop ? '' : `<polygon points="${top}" ${s}/><polygon points="${top}" fill="#fff" opacity="${o.tl ?? .2}"/>`}</g>`;
}

const VB = 'viewBox="0 0 1260 900" preserveAspectRatio="xMidYMax slice"';
const layer = (depth, inner, cls = '') => `<div class="layer ${cls}" data-depth="${depth}"><svg ${VB}>${inner}</svg></div>`;

/* ---------------- B: Glitzerstadt bei Nacht ---------------- */
function skylineB(seed, base, minH, maxH, fill, win, count){
  const r = rng(seed); let x = -20, s = '', w = '';
  for (let i = 0; i < count && x < 1280; i++){
    const bw = 50 + r() * 70, bh = minH + r() * (maxH - minH), top = base - bh;
    s += `<rect x="${x.toFixed(0)}" y="${top.toFixed(0)}" width="${bw.toFixed(0)}" height="${bh + 400}"/>`;
    const t = r();
    if (t < .3) s += `<circle cx="${(x + bw / 2).toFixed(0)}" cy="${top.toFixed(0)}" r="${(bw * .38).toFixed(0)}"/><path d="M${(x + bw / 2 - 5).toFixed(0)} ${(top - bw * .3).toFixed(0)} L${(x + bw / 2).toFixed(0)} ${(top - bw * .75).toFixed(0)} L${(x + bw / 2 + 5).toFixed(0)} ${(top - bw * .3).toFixed(0)}Z"/>`;
    else if (t < .55) s += `<path d="M${x.toFixed(0)} ${top.toFixed(0)} L${(x + bw / 2).toFixed(0)} ${(top - bw * .9).toFixed(0)} L${(x + bw).toFixed(0)} ${top.toFixed(0)}Z"/>`;
    if (win) for (let yy = top + 16; yy < base - 10; yy += 22) for (let xx = x + 10; xx < x + bw - 12; xx += 16) if (r() < .32) w += `<rect x="${xx.toFixed(0)}" y="${yy.toFixed(0)}" width="7" height="10" rx="2" fill="${r() < .5 ? '#FFD66B' : '#FF9AD9'}" opacity="${(.45 + r() * .5).toFixed(2)}"/>`;
    x += bw + 4 + r() * 20;
  }
  return `<g fill="${fill}">${s}</g>${w}`;
}
function neon(d, c, extra = ''){ return `<g ${extra}><path d="${d}" fill="none" stroke="${c}" stroke-width="14" opacity=".18" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="7" opacity=".45" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>`; }

  /* Zahlenstrahl als SVG. opt.arrow = Wert mit Pfeil, opt.labels = 'major'|'all' */
  line(q, opt = {}){

    for (let v = q.min; v <= q.max + 1e-9; v += q.minor){
      const mi = Math.round((v - q.min) / q.major), major = Math.abs(((v - q.min) / q.major) - mi) < 1e-9, showLab = major && (mi % every === 0 || v === q.max);
      s += `<line x1="${X(v)}" y1="${y - (major ? 20 : 11)}" x2="${X(v)}" y2="${y + (major ? 20 : 11)}" stroke="${major ? '#fff' : '#CDB6F0'}" stroke-width="${major ? 4 : 2.5}"/>`;

  },
  writtenStatic({ a, b, op, carries }){

function caseView(c, v){
  const cs = typeof App !== 'undefined' && App.p ? (App.p.cases[c.id] || {}) : {};
  const i = v != null ? v : (cs.variant || 0);
  if (!i || !c.variants || !c.variants[i - 1]) return c;
  return Object.assign({}, c, c.variants[i - 1], { variant: i });
}
function nextVariant(c, cur){ const n = 1 + (c.variants ? c.variants.length : 0); return ((cur || 0) + 1) % n; }
