/* ===== 75-ui-case.js ===== */
/* =====================================================================
   FALL-ABLAUF
   Intro-Filmszene → 5 Rätsel (jedes bringt eine Hinweiskarte)
   → Wer war es? (kombinieren) → Auflösung → Belohnung und Cliffhanger.
   Der Fortschritt wird nach jedem Rätsel gespeichert, man kann jederzeit
   aufhören und später weiter ermitteln.
   ===================================================================== */
const CHAR_RATIO = { detective: 300 / 232, fairy: 214 / 170, unicorn: 1, baker: 190 / 150, bunny: 96 / 110, magpie: 190 / 170, owl: 200 / 170, kobold: 220 / 170, starling: 170 / 160, mystery: 170 / 160 };
function castEl(id, o){
  const k = CAST[id].char;
  return charEl(k, { float: k === 'starling' || k === 'mystery', ...o, h: Math.round(o.w * (CHAR_RATIO[k] || 1.15)) });
}
const whoName = w => w === 'partner' ? App.pName() : w === 'det' ? `Detektivin ${escapeHTML(App.p.name)}` : CAST[w].name;

/* ---------- Einstieg in einen Fall (neu, fortsetzen oder wiederholen) ---------- */
function startCase(c0){
  const p = App.p, cs = caseState(p, c0.id);
  // Wiederholung: nächste Version mit anderem Täter und anderen Hinweisen
  if (cs.status === 'done' && !cs.replay){ Object.assign(cs, { replay: true, step: 0, seen: 0, scores: [], firstTry: true, proofOk: true, variant: nextVariant(c0, cs.variant) }); App.save(); }
  const c = caseView(c0);
  cs.seen = cs.seen || 0;
  const run = () => {
    if (cs.seen < cs.step) return App.show(ClueScreen(c, cs.seen, run));
    if (cs.step >= 5) return App.show(AccuseScreen(c));
    App.show(TaskScreen(caseSession(c)));
  };
  if (cs.step === 0){
    App.show(CaseScene(c, c.intro, () => { if (cs.status === 'new') cs.status = 'active'; App.save(); run(); }, { last: 'Ermittlung starten' }));
  } else run();
}

function caseSession(c){
  const cs = caseState(App.p, c.id);
  const s = { kind: 'case', caseId: c.id, title: `Fall ${c.nr}`, icon: 'lupe', total: 5, index: cs.step, maxWrong: 99, allowSolution: true,
    results: Array.from({ length: cs.step }, (_, k) => ({ score: (cs.scores || [])[k] ?? 1 })),
    make(i){
      GEN_STUFF = c.stuff;
      let tk;
      try { tk = Model.newTask(App.p, i === 4 ? { bump: 1 } : {}); } finally { GEN_STUFF = null; }
      if (i === 4){ tk.title = 'Meister-Schloss'; tk.frame = 'schloss'; }
      if (tk.genericStory) tk.story = c.flavor[i % c.flavor.length];
      return tk;
    },
    record(tk, res){
      Model.record(App.p, tk, res); this.results.push({ score: res.score, gems: res.gems });
      cs.scores = cs.scores || []; cs.scores[this.index] = res.score;
      cs.step = Math.max(cs.step, this.index + 1); if (cs.status === 'new') cs.status = 'active';
      App.save();
    },
    between(i, go){ clueOverlay(App.root, c, i, () => { cs.seen = Math.max(cs.seen || 0, i + 1); App.save(); go(); }); },
    finish(){ App.show(AccuseScreen(c)); }
  };
  return s;
}

/* ---------- Hinweiskarte: der Begleiter findet den Hinweis mit seiner Fähigkeit ---------- */
function clueOverlay(root, c, i, onClose){
  const cl = c.clues[i], last = i === c.clues.length - 1, P = App.pName(), mys = cl.role === 'mystery';
  const ov = document.createElement('div'); ov.className = 'clue-ov';
  ov.innerHTML = `<div class="clue-card finding ${mys ? 'mys' : ''}">
    <div class="cfind"><span class="av">${partnerEl({ x: 0, y: 0, w: 84, expr: 'nachdenklich' })}</span><span>${fillText(cl.find)}</span></div>
    <div class="csearch">${icon('lupe')}</div>
    <div class="cbody"><div class="ci">${clueIcon(cl.icon)}</div><div>
      <div class="k">${mys ? 'Geheimnisvoller Hinweis' : 'Hinweis gefunden!'} · ${i + 1} von 5</div>
      <h3>${cl.title}</h3><p>${fillText(cl.text)}</p></div></div>
    <div class="cthink"><b>${P} überlegt:</b> ${fillText(cl.think)}</div>
    <div class="crow">${cluePips(i + 1, false)}<button class="btn" data-x>${last ? 'Wer war es?' : 'Weiter ermitteln'}${icon('weiter')}</button></div></div>`;
  root.appendChild(ov);
  const card = ov.querySelector('.clue-card'), av = ov.querySelector('.cfind .char');
  Sound.whoosh(); if (av) hop(av);
  setTimeout(() => {
    if (!card.isConnected) return;
    card.classList.remove('finding'); if (av){ av.dataset.expr = 'ueberrascht'; hop(av); }
    Sound.sparkle(); const ic = ov.querySelector('.ci'); const [x, y] = center(ic); FX.burst(x, y, 30, 1.3);
  }, RM ? 50 : 1100);
  let done = false;
  ov.querySelector('[data-x]').onclick = e => { e.stopPropagation(); if (done) return; done = true; ov.remove(); onClose(); };
}
function ClueScreen(c, i, then){
  return { mood: 'calm', fx: 'glitter',
    html(){ return sceneB() + `<div class="dim"></div><div class="ui"><div class="topbar"><div class="title-chip">${icon('lupe')}Fall ${c.nr}</div></div></div>`; },
    bind(el){ clueOverlay(el, c, i, () => { const cs = caseState(App.p, c.id); cs.seen = Math.max(cs.seen || 0, i + 1); App.save(); then(); }); } };
}

/* ---------- Filmszene mit mehreren Figuren ---------- */
function CaseScene(c, lines, onDone, opt = {}){
  let i = 0;
  return {
    mood: 'calm', fx: 'glitter',
    html(port){
      const L = lines[i], spk = L.who;
      const ex = {}, seen = [];
      for (let k = 0; k <= i; k++){ const w = lines[k].who; ex[w] = lines[k].expr || 'normal'; if (w !== 'partner' && w !== 'det'){ const j = seen.indexOf(w); if (j >= 0) seen.splice(j, 1); seen.push(w); } }
      if (!seen.length) seen.push(c.host);
      const guests = seen.slice(-2).reverse(); // [0] = zuletzt gesprochen
      const cls = w => w === spk ? 'speaking' : 'quiet';
      // Detektivin ist die Hauptfigur (am größten), Begleiter etwas kleiner
      const pos = port
        ? { de: { x: 250, y: 380, w: 250 }, pa: { x: 30, y: 470, w: pw(210) }, g: [{ x: 530, y: 400, w: 250 }, { x: 590, y: 140, w: 190, z: 5 }], pl: 'left:40px;top:120px', box: 'left:24px;right:24px;top:800px;height:356px' }
        : { de: { x: 290, y: 190, w: 250 }, pa: { x: 70, y: 280, w: pw(210) }, g: [{ x: 860, y: 190, w: 250 }, { x: 650, y: 250, w: 190, z: 5 }], pl: 'left:480px;top:96px', box: 'left:60px;right:60px;top:528px;height:270px' };
      if (App.partner() === 'fairy'){ pos.pa.y -= port ? 30 : 30; }
      return sceneB() + `<div class="dim"></div><div class="ui">
        <div class="topbar"><div class="title-chip">${icon('lupe')}${port ? `Fall ${c.nr}` : `Fall ${c.nr} · ${c.place}`}</div><div class="grow"></div><button class="btn sec small" data-act="skip">Überspringen</button></div>
        <div class="placebadge" style="${pos.pl}">${BUILD[c.node]()}</div>
        <div class="cast">
          ${detEl({ ...pos.de, z: 6, expr: spk === 'det' ? (L.expr || 'normal') : (opt.det || ex.det || 'normal'), cls: spk === 'det' ? 'speaking' : '' })}
          ${partnerEl({ ...pos.pa, z: 7, expr: ex.partner || 'normal', cls: cls('partner') })}
          ${guests.map((g, k) => castEl(g, { ...pos.g[k], expr: ex[g] || 'normal', cls: cls(g) })).join('')}
        </div>
        <div class="panel cut-box fade-in" data-next style="${pos.box}">
          <div class="row"><span class="who">${whoName(spk)}</span></div>
          <p>${fillText(L.text)}</p>
          <div class="row"><div class="dots-prog">${lines.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div><button class="btn" data-act="next">${i < lines.length - 1 ? 'Weiter' : (opt.last || 'Weiter')}${icon('weiter')}</button></div>
        </div>
      </div>`;
    },
    bind(el){
      const sp = el.querySelector('.cast .speaking'); if (sp) hop(sp);
      let busy = false;
      const next = () => { if (busy) return; if (i < lines.length - 1){ i++; App.render(false); Sound.tap(); } else { busy = true; onDone(); } };
      el.querySelector('[data-act="next"]').onclick = e => { e.stopPropagation(); next(); };
      el.querySelector('[data-next]').addEventListener('click', e => { if (!e.target.closest('button')) next(); });
      el.querySelector('[data-act="skip"]').onclick = () => { if (!busy){ busy = true; onDone(); } };
    }
  };
}

/* ---------- Wer war es? Hinweise kombinieren, dann beweisen ---------- */
function AccuseScreen(c){
  const cs = caseState(App.p, c.id), P = App.pName();
  let out = [], hl = [], phase = 'accuse', picks = [], good = [], tipI = 0;
  let say = { text: 'Wir haben alle fünf Hinweise! Lies sie in Ruhe. Wer kann es NICHT gewesen sein? Und wer bleibt übrig? Tippe dann auf die richtige Karte.', expr: 'nachdenklich' };
  const talk = (text, expr, ok) => { say = { text, expr, ok }; bubbleSay(text, expr, ok); };
  const finish = () => App.show(CaseScene(c, c.solved, () => App.show(CaseReward(c)), { det: 'freudig', last: 'Fall abschließen' }));
  const scr = {
    mood: 'calm', fx: 'dust',
    html(port){
      const proof = phase === 'proof' || phase === 'proved';
      const board = `<h3>${icon('lupe')}${proof ? 'Beweise es! Tippe zwei Hinweise an.' : 'Unsere Hinweise'}</h3>${c.clues.map((cl, k) => `<button class="cmini ${hl.includes(k) ? 'hl' : ''} ${picks.includes(k) ? 'pick' : ''} ${good.includes(k) ? 'good' : ''}" data-clue="${k}" ${proof ? '' : 'tabindex="-1"'}>${clueIcon(cl.icon)}<span class="ct"><b>${k + 1}. ${cl.title}</b><span>${fillText(cl.text)}</span></span>${proof ? `<i class="tick">${icon('check')}</i>` : ''}</button>`).join('')}`;
      const cards = c.suspects.map(id => { const yes = phase !== 'accuse' && id === c.culprit, no = out.includes(id);
        return `<button class="scard ${no ? 'no' : ''} ${yes ? 'yes' : ''}" data-sus="${id}"><span class="fig">${castEl(id, { x: 0, y: 0, w: port ? 150 : 175, expr: yes ? 'ueberrascht' : no ? 'freudig' : 'normal' })}</span><b>${CAST[id].name}</b><span class="facts">${(c.facts[id] || [CAST[id].role]).map(f => `<small>${f}</small>`).join('')}</span></button>`; }).join('');
      return sceneB() + `<div class="dim"></div><div class="ui ${proof ? 'proofing' : ''}">
        <div class="topbar"><button class="btn sec round" data-act="map" aria-label="Zur Karte">${icon('karte')}</button><div class="title-chip">${icon('lupe')}${proof ? 'Beweise es!' : 'Wer war es?'}</div><div class="grow"></div><button class="btn mint small" data-act="tip">${icon('hilfe')}Frag ${P}</button>${port ? '' : gemChip()}</div>
        ${partnerEl(port ? { x: 20, y: 100, w: pw(140), expr: say.expr } : { x: 506, y: 100, w: pw(140), expr: say.expr })}
        <div class="bubble sm ${say.ok ? 'good' : ''}" data-bubble style="${port ? 'left:170px;right:24px;top:100px' : 'left:660px;top:96px;width:496px'}"><span class="who">${P}</span><span data-say>${say.text}</span></div>
        <div class="suspects-big" style="${port ? 'left:24px;right:24px;top:300px;height:350px' : 'left:510px;right:24px;top:352px;height:448px'}">${cards}</div>
        <div class="panel board ${port ? 'tight' : ''}" style="${port ? 'left:24px;right:24px;top:664px;height:496px' : 'left:24px;top:100px;width:466px;height:700px'}">${board}</div>
      </div>`;
    },
    bind(el){
      el.querySelector('[data-act="map"]').onclick = () => App.show(MapScreen({ focus: c.node }));
      el.querySelector('[data-act="tip"]').onclick = () => {
        if (phase === 'accuse'){ talk(c.tips[Math.min(tipI, c.tips.length - 1)], 'nachdenklich'); tipI++; }
        else if (phase === 'proof') talk('Tipp: Jeder richtige Hinweis zeigt, dass einer der anderen es NICHT war. Die falsche Fährte hilft dir hier nicht.', 'nachdenklich');
      };
      el.querySelectorAll('[data-sus]').forEach(b => b.onclick = () => {
        const id = b.dataset.sus; if (phase !== 'accuse' || out.includes(id)) return;
        if (id === c.culprit){
          phase = 'caught'; cs.firstTry = cs.firstTry !== false && out.length === 0; App.save();
          b.classList.add('yes'); const ch = b.querySelector('.char'); if (ch){ ch.dataset.expr = 'ueberrascht'; hop(ch); }
          const st = document.createElement('div'); st.className = 'caught'; st.textContent = c.reveal ? 'Gefunden!' : 'Erwischt!'; App.root.appendChild(st);
          Sound.stamp(); FX.confetti(60); setTimeout(() => Sound.reward(), 300);
          talk('Ja! Richtig kombiniert!', 'freudig', true);
          setTimeout(() => { if (App.cur !== scr) return; phase = 'proof'; hl = []; say = { text: 'Jetzt kommt der Beweis, Detektivin! Tippe die zwei Hinweise an, die zeigen, dass es die anderen beiden NICHT gewesen sein können.', expr: 'nachdenklich' }; App.render(false); }, 1900);
          return;
        }
        out.push(id); cs.firstTry = false; App.save(); Sound.no();
        const k = c.clues.findIndex(cl => cl.clears === id); hl = k >= 0 ? [k] : [];
        say = { text: c.wrong[id] || 'Hmm, das passt nicht zu den Hinweisen. Schau noch einmal genau hin!', expr: 'nachdenklich' };
        App.render(false);
      });
      el.querySelectorAll('[data-clue]').forEach(b => b.onclick = () => {
        if (phase !== 'proof') return;
        const k = +b.dataset.clue; if (good.includes(k)) return;
        picks = picks.includes(k) ? picks.filter(x => x !== k) : [...picks, k].slice(-(2 - good.length));
        Sound.key(); b.classList.toggle('pick', picks.includes(k));
        const all = [...good, ...picks];
        if (all.length < 2) return;
        const right = all.filter(x => c.proof.includes(x));
        if (right.length === 2){
          phase = 'proved'; good = right.slice(); picks = []; cs.proofOk = cs.proofOk !== false; App.save();
          Sound.ok(); FX.confetti(50);
          say = { text: `Bewiesen! ${c.proof.map(x => `Hinweis ${x + 1}`).join(' und ')} schließen die anderen aus. So arbeiten echte Meisterdetektivinnen!`, expr: 'freudig', ok: true };
          App.render(false); setTimeout(() => { if (App.cur === scr) finish(); }, 2600);
          return;
        }
        cs.proofOk = false; App.save(); Sound.no();
        const wrongOne = all.find(x => !c.proof.includes(x)), cl = c.clues[wrongOne];
        good = right.slice(); picks = [];
        const why = cl.role === 'herring' ? `Hinweis ${wrongOne + 1} war eine falsche Fährte.` : cl.role === 'mystery' ? `Hinweis ${wrongOne + 1} ist ein Geheimnis für später.` : `Hinweis ${wrongOne + 1} zeigt nicht, wer es NICHT war.`;
        say = { text: `${right.length ? 'Einer stimmt schon! ' : ''}${why} Welcher Hinweis gibt jemandem ein Alibi oder zeigt, was jemand nicht kann?`, expr: 'nachdenklich' };
        App.render(false);
      });
    }
  };
  return scr;
}

/* ---------- Fall gelöst: Sterne, Glitzersteine, Geschenke, Cliffhanger ----------
   Sterne: 1 fürs Lösen · 1 für gute Rätsel (Schnitt ≥ 60 %) · 1 für Kombinieren und Beweisen ohne Fehlversuch */
function CaseReward(c){
  const p = App.p, cs = caseState(p, c.id);
  const first = cs.status !== 'done';
  const sc = (cs.scores || []).filter(x => x != null), avg = sc.length ? sc.reduce((a, b) => a + b, 0) / sc.length : 1;
  const sharp = cs.firstTry !== false && cs.proofOk !== false;
  const stars = 1 + (avg >= .6 ? 1 : 0) + (sharp ? 1 : 0);
  const gems = first ? c.reward.gems : 15;
  // Zustand sofort sichern, damit nichts doppelt vergeben wird
  cs.stars = Math.max(cs.stars || 0, stars); cs.plays = (cs.plays || 0) + 1; Report.caseSolved(p, c.id, stars);
  Object.assign(cs, { status: 'done', replay: false, step: 0, seen: 0, scores: [], firstTry: true, proofOk: true });
  if (first){ c.reward.items.forEach(k => hqGift(k)); c.reward.pets.forEach(k => hqGift(k)); }
  const next = CASES[CASES.findIndex(x => x.id === c.id) + 1];
  const gifts = first ? [...c.reward.items, ...c.reward.pets] : [];
  const praise = stars === 3 ? 'Drei Sterne! Meisterdetektivinnen-Arbeit!' : stars === 2 ? 'Super ermittelt! Fall gelöst!' : 'Fall gelöst! Du bist drangeblieben!';
  const how = sharp ? '' : 'Nächstes Mal ohne Fehlversuch kombinieren, dann gibt es den dritten Stern.';
  const fly = Math.min(gems, 12);
  App.p.gems += gems; App.save();
  let paid = false;
  return {
    mood: null, fx: 'glitter',
    html(port){
      return sceneB() + '<div class="burst"></div>' + `<div class="ui">
        <div class="topbar"><div class="title-chip">${icon('lupe')}Fall ${c.nr}</div><div class="grow"></div>${gemChip()}</div>
        <div class="panel rew" style="${port ? 'left:40px;right:40px;top:100px' : 'left:270px;top:96px;width:600px'}">
          <span class="rkick">${c.title}</span>
          <h1 class="banner">Fall gelöst!</h1>
          <div class="stars3">${[0, 1, 2].map(i => starSVG(i >= stars)).join('')}</div>
          <p class="rpraise">${praise}${how && stars < 3 ? `<small>${how}</small>` : ''}</p>
          <div class="gain" style="font-size:44px">${gem(46)}<span>+</span><span data-count="${gems}">${paid ? gems : 0}</span></div>
          ${gifts.length ? `<div class="unlocks">${gifts.map(k => `<div class="panel unlock"><span class="art">${itemFront(k)}</span><span><b>${ITEMS[k].pet ? 'Zieht bei euch ein' : 'Neu fürs Hauptquartier'}</b><span>${ITEMS[k].name}</span></span></div>`).join('')}</div>` : ''}
          <div class="rbtns"><button class="btn sec" data-act="hq">${icon('sofa')}Hauptquartier</button><button class="btn" data-act="map">${icon('karte')}Zur Karte</button></div>
        </div>
        <div class="cliff" style="${port ? 'left:60px;right:60px;top:790px' : 'left:900px;top:300px;width:256px'}">${c.variant ? `<b>Schon gewusst?</b>Wenn du diesen Fall nochmal spielst, wartet ein anderes Rätsel mit einem anderen Täter.` : `<b>${next ? 'Psst … Was ist das?' : 'Fortsetzung folgt'}</b>${c.cliff}`}</div>
        ${detEl(port ? { x: 40, y: 985, w: 145, expr: 'freudig' } : { x: 24, y: 400, w: 230, expr: 'freudig' })}
        ${partnerEl(port ? { x: 640, y: 1040, w: pw(130), expr: 'freudig' } : { x: 960, y: 610, w: pw(160), expr: 'freudig' })}
      </div>`;
    },
    bind(el){
      const c0 = el.querySelector('[data-count]');
      if (!paid){
        paid = true;
        const t0 = performance.now(), target = gems;
        const tick = t => { const f = Math.min(1, (t - t0 - 400) / 1000); if (f > 0) c0.textContent = Math.round(target * (1 - Math.pow(1 - f, 3))); if (f < 1 && c0.isConnected) requestAnimationFrame(tick); };
        requestAnimationFrame(tick); setTimeout(() => { FX.confetti(100); Sound.reward(); }, 250);
        const chip = el.querySelector('[data-gems] .gem-n'); if (chip) chip.textContent = App.p.gems - gems;
        setTimeout(() => { if (!c0.isConnected) return; const [x, y] = center(c0); App.p.gems -= fly; flyGems(fly, x, y); }, 1300);
      }
      el.querySelector('[data-act="map"]').onclick = () => App.show(MapScreen(next && first ? { focus: next.node, reveal: next.node, msg: `Schau mal! Der Nebel über dem Ort „${MAP_NODES.find(n => n.k === next.node).name}“ ist weg. Ein neuer Fall wartet!` } : { focus: c.node }));
      el.querySelector('[data-act="hq"]').onclick = () => App.show(HQScreen());
    }
  };
}

/* ===== 76-ui-hq.js ===== */
/* =====================================================================
   HAUPTQUARTIER: ruhiger Bau-Modus
   Möbel mit Glitzersteinen kaufen, per Finger ziehen oder antippen und
   dann ins Zimmer tippen. Positionen werden normalisiert gespeichert
   (u = links→rechts, v = hinten→vorne), damit Hoch- und Querformat passen.
   ===================================================================== */
const HQ_FLOOR = { land: { x0: 70, x1: 1110, y0: 490, y1: 606, bar: 612 }, port: { x0: 60, x1: 760, y0: 690, y1: 950, bar: 968 } };
function hqEnsure(p){
  if (!p.hq) p.hq = { owned: { teppich: 1, pinnwand: 1 }, placed: [{ k: 'teppich', u: .45, v: .55 }, { k: 'pinnwand', u: .18, v: .02 }] };
  return p.hq;
}
/* Freien Platz im Zimmer suchen: möglichst weit weg von allem, was schon steht */
function hqFreeSpot(hq){
  let best = [.5, .5], bd = -1;
  for (let u = .08; u <= .92; u += .07) for (const v of [.25, .55, .85]){
    const d = Math.min(...hq.placed.filter(x => !ITEMS[x.k].floor).map(x => Math.hypot(x.u - u, (x.v - v) * .5)), 9);
    if (d > bd + .001){ bd = d; best = [u, v]; }
  }
  return { u: +best[0].toFixed(3), v: +best[1].toFixed(3) };
}
function hqGift(k){
  const hq = hqEnsure(App.p);
  hq.owned[k] = (hq.owned[k] || 0) + 1;
  hq.placed.push({ k, ...hqFreeSpot(hq), n: 1 });
}
const hqAvail = (hq, k) => (hq.owned[k] || 0) - hq.placed.filter(x => x.k === k).length;
const unlockCase = k => ITEMS[k].unlock ? CASE[ITEMS[k].unlock] : null;
const isUnlocked = k => { const c = unlockCase(k); return !c || (App.p.cases[c.id] || {}).status === 'done'; };

function roomB(port){
  const id = uid('rm'), W = port ? 820 : 1180, H = port ? 1180 : 820, wall = port ? 660 : 480;
  const win = port ? { x: 260, w: 300, r: 150, top: 380 } : { x: 670, w: 360, r: 180, top: 250 };
  const wx1 = win.x + win.w, wc = win.x + win.w / 2;
  const star = port ? 'M110 170 l14 30 32 4 -23 22 6 32 -29-15 -29 15 6-32 -23-22 32-4z' : 'M190 150 l14 30 32 4 -23 22 6 32 -29-15 -29 15 6-32 -23-22 32-4z';
  const sh = port ? { x: 600, y: 470, w: 190 } : { x: 120, y: 290, w: 220 };
  const books = [0, 1, 2, 3, 4].map(i => `<rect x="${sh.x + 20 + i * (sh.w - 40) / 5}" y="${sh.y - 40 - i % 2 * 12}" width="${22 + i % 3 * 6}" height="${40 + i % 2 * 12}" rx="4" fill="${['#FF4FB8', '#4EE8FF', '#9C7BFF', '#FFD66B', '#FF8AD6'][i]}" opacity=".85"/>`).join('');
  const rays = (port ? [-900, -500, -100, 410, 920, 1320, 1720] : [-600, -200, 200, 590, 980, 1380, 1780]).map(x => `<path d="M${port ? 410 : 590} ${wall} L${x} ${H}" stroke="#3E2580" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs>
      ${grad(id + 'w', [[0, '#2B1862'], [1, '#1B0E44']])}${grad(id + 'f', [[0, '#2D1660'], [1, '#150931']])}${grad(id + 's', [[0, '#1A0F45'], [.6, '#6A1F7E'], [1, '#FF7FA8']])}
      <clipPath id="${id}c"><path d="M${win.x} ${wall} V${win.top} a${win.r} ${win.r} 0 0 1 ${win.w} 0 V${wall}Z"/></clipPath></defs>
    <rect width="${W}" height="${wall + 10}" fill="url(#${id}w)"/>
    <g clip-path="url(#${id}c)"><rect x="${win.x - 10}" y="0" width="${win.w + 20}" height="${wall}" fill="url(#${id}s)"/><circle cx="${wx1 - 90}" cy="${win.top - 60}" r="30" fill="#FFF3DD"/>
      <g transform="translate(${win.x - 20} 0)">${skylineB(9, wall, 60, 200, '#3A1868', true, 12)}</g></g>
    ${neon(`M${win.x} ${wall} V${win.top} a${win.r} ${win.r} 0 0 1 ${win.w} 0 V${wall}`, '#FF5FC4')}<path d="M${wc} 0 V${wall} M${win.x} ${win.top + 100} H${wx1}" stroke="#1B0E44" stroke-width="10" clip-path="url(#${id}c)"/>
    ${neon(`M40 26 H${W - 40}`, '#4EE8FF')}
    ${neon(star, '#FFD66B', 'class="twinkle"')}
    <rect x="${sh.x}" y="${sh.y}" width="${sh.w}" height="12" rx="6" fill="#140828"/>${books}
    <rect y="${wall}" width="${W}" height="${H - wall}" fill="url(#${id}f)"/>
    <path d="M${win.x} ${wall} L${wx1} ${wall} L${wx1 + 100} ${H} L${win.x - 90} ${H}Z" fill="#FF7FC8" opacity=".07"/>
    ${rays}<rect y="${wall - 4}" width="${W}" height="8" fill="#FF5FC4" opacity=".55"/></svg>`;
}
/* Kleine Bilderrahmen an der Wand: gelöste Fälle mit Sternen */
function trophiesHTML(port){
  return `<div class="trophies" style="${port ? 'left:40px;top:300px' : 'left:380px;top:110px'}">${CASES.map(c => { const cs = App.p.cases[c.id] || {}, d = cs.status === 'done';
    return `<div class="trophy ${d ? 'on' : ''}"><span class="tb">${d ? BUILD[c.node]() : '<b>?</b>'}</span><span class="ts">${d ? [0, 1, 2].map(i => starSVG(i >= cs.stars)).join('') : `Fall ${c.nr}`}</span></div>`; }).join('')}</div>`;
}

function HQScreen(){
  const hq = hqEnsure(App.p); App.save();
  let tab = 'moebel';
  return {
    mood: 'calm', fx: 'dust',
    html(port){
      return `<div class="room">${roomB(port)}<div class="warm"></div></div><div class="ui" data-hq>
        <div class="topbar"><button class="btn sec round" data-act="map" aria-label="Zur Karte">${icon('karte')}</button><div class="title-chip">${icon('haus')}${port ? 'Zuhause' : 'Mein Hauptquartier'}</div><div class="grow"></div>${gemChip()}<button class="btn mint small" data-act="map">${icon('check')}Fertig</button></div>
        ${trophiesHTML(port)}
        <div data-room-items style="position:absolute;left:0;top:0;width:${port ? 820 : 1180}px;height:${port ? 1180 : 820}px;z-index:3;touch-action:none"></div>
        <div class="panel hq-bar" style="left:24px;right:24px;bottom:16px"><div class="hq-tabs"><button class="t ${tab === 'moebel' ? 'on' : ''}" data-tab="moebel">${icon('sofa')}Möbel</button><button class="t ${tab === 'bewohner' ? 'on' : ''}" data-tab="bewohner">${icon('herz')}Bewohner</button><span class="hint">${icon('hand')}${port ? 'Ziehen oder antippen' : 'Ins Zimmer ziehen oder antippen'}</span></div><div class="shelf" data-shelf></div></div>
      </div>`;
    },
    bind(el){
      const port = App.port, FL = port ? HQ_FLOOR.port : HQ_FLOOR.land, wrap = el.querySelector('[data-room-items]');
      let sel = null, armed = null, drag = null, menu = null;
      const scl = v => port ? 1 + v * .4 : .8 + v * .32;
      const toXY = pl => [FL.x0 + pl.u * (FL.x1 - FL.x0), FL.y0 + pl.v * (FL.y1 - FL.y0)];
      const toUV = (x, y) => [clamp((x - FL.x0) / (FL.x1 - FL.x0), 0, 1), clamp((y - FL.y0) / (FL.y1 - FL.y0), 0, 1)];
      const gemsNow = () => { const n = el.querySelector('[data-gems] .gem-n'); if (n) n.textContent = App.p.gems; };
      function pos(pl){
        const it = ITEMS[pl.k], [x, y] = toXY(pl), s = it.floor ? 1.05 : scl(pl.v), w = it.w * s, h = it.h * s;
        pl.el.style.cssText = `left:${(x - w / 2).toFixed(1)}px;top:${(it.floor ? y - h / 2 : y - h).toFixed(1)}px;width:${w.toFixed(1)}px;height:${h.toFixed(1)}px;z-index:${it.floor ? 2 : 10 + Math.round(y)}`;
        pl.el.classList.toggle('flip', !!pl.f);
      }
      function mount(pl, land){
        const el2 = document.createElement('div'); el2.className = 'pl' + (land ? ' land' : ''); el2.innerHTML = itemFront(pl.k);
        if (ITEMS[pl.k].pet) el2.querySelector('.idle')?.style.setProperty('animation', 'floaty 2.6s ease-in-out infinite');
        Object.defineProperty(pl, 'el', { value: el2, enumerable: false, configurable: true, writable: true }); el2._p = pl;
        wrap.appendChild(el2); pos(pl); return pl;
      }
      // Begleiter wohnt mit im Zimmer (steht fest, gehört aber in die Tiefen-Reihenfolge)
      const pw = App.partner() === 'fairy' ? 150 : 180, [px, py] = port ? [690, 760] : [1040, 560];
      const pa = document.createElement('div'); pa.innerHTML = partnerEl({ x: px - pw / 2, y: py - pw * (App.partner() === 'fairy' ? 1.26 : 1), w: pw, z: 10 + py, expr: 'freudig' }); wrap.appendChild(pa.firstElementChild);
      hq.placed.forEach(pl => { mount(pl, pl.n); if (pl.n){ delete pl.n; setTimeout(() => { if (pl.el.isConnected){ const [x, y] = toXY(pl); FX.burst(x, y - 40, 26, 1.1); Sound.sparkle(); } }, 500); } });
      App.save();

      function closeMenu(){ menu?.remove(); menu = null; if (sel) sel.el.classList.remove('sel'); sel = null; }
      function openMenu(pl){
        closeMenu(); sel = pl; pl.el.classList.add('sel');
        const [bx] = toXY(pl), top = clamp(parseFloat(pl.el.style.top) - 96, 96, FL.bar - 200);
        menu = document.createElement('div'); menu.className = 'panel selmenu fade-in'; menu.style.left = clamp(bx, 170, (port ? 820 : 1180) - 170) + 'px'; menu.style.top = top + 'px';
        menu.innerHTML = `<button data-a="flip">${icon('spiegeln')}Spiegeln</button><button data-a="box">${icon('kiste')}In die Kiste</button><button class="ok" data-a="ok">${icon('check')}Fertig</button>`;
        menu.addEventListener('pointerdown', e => e.stopPropagation());
        menu.addEventListener('click', e => {
          const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
          if (a === 'flip'){ pl.f = pl.f ? 0 : 1; pos(pl); pl.el.classList.add('sel'); App.save(); }
          if (a === 'box'){ const [x, y] = toXY(pl); FX.burst(x, y - 40, 14); pl.el.remove(); hq.placed = hq.placed.filter(q => q !== pl); closeMenu(); App.save(); shelf(); toast('Zurück in der Kiste'); }
          if (a === 'ok') closeMenu();
        });
        el.querySelector('.ui').appendChild(menu);
      }
      function landFx(pl){ pl.el.classList.remove('land'); void pl.el.offsetWidth; pl.el.classList.add('land'); const [x, y] = toXY(pl); FX.burst(x, y - 10, 12, .7); Sound.place(); }
      function disarm(){ armed?.classList.remove('armed'); armed = null; }
      function place(k, x, y){
        const [u, v] = toUV(x, y), pl = { k, u: +u.toFixed(3), v: +v.toFixed(3) };
        hq.placed.push(pl); mount(pl); landFx(pl); App.save(); shelf();
        if (hq.placed.length >= 5 && !App.p.hqPraised){ App.p.hqPraised = true; App.save(); setTimeout(() => toast(`${App.pName()}: Wie gemütlich es hier wird!`), 600); }
      }

      // Platzierte Dinge verschieben oder antippen
      wrap.addEventListener('pointerdown', e => {
        const t = e.target.closest('.pl'); const [x, y] = App.pt(e);
        if (!t){
          if (armed && y < FL.bar){ const k = armed.dataset.item; disarm(); place(k, x, y); return; }
          if (!e.target.closest('.char')) closeMenu(); return;
        }
        e.preventDefault(); const pl = t._p, [bx, by] = toXY(pl);
        drag = { pl, id: e.pointerId, sx: x, sy: y, ox: bx - x, oy: by - y, moved: false };
        try { wrap.setPointerCapture(e.pointerId); } catch (_){}
      });
      wrap.addEventListener('pointermove', e => {
        if (!drag || e.pointerId !== drag.id) return; const [x, y] = App.pt(e);
        if (!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 9){ drag.moved = true; closeMenu(); drag.pl.el.classList.add('drag'); }
        if (drag.moved){ const [u, v] = toUV(x + drag.ox, y + drag.oy); drag.pl.u = +u.toFixed(3); drag.pl.v = +v.toFixed(3); pos(drag.pl); drag.pl.el.classList.add('drag'); }
      });
      const end = e => {
        if (!drag || e.pointerId !== drag.id) return; const d = drag; drag = null; d.pl.el.classList.remove('drag');
        if (d.moved){ landFx(d.pl); App.save(); } else (sel === d.pl ? closeMenu() : openMenu(d.pl));
      };
      wrap.addEventListener('pointerup', end); wrap.addEventListener('pointercancel', end);

      /* ----- Regal mit Möbeln und Bewohnern ----- */
      function cardHTML(k){
        const it = ITEMS[k], av = hqAvail(hq, k), ok = isUnlocked(k), uc = unlockCase(k);
        if (!ok) return `<div class="itemcard locked" data-item="${k}"><div class="art">${itemFront(k)}</div><div class="price">nach Fall ${uc.nr}</div><span class="lk">${icon('schloss')}</span></div>`;
        if (it.pet) return `<div class="itemcard ${av > 0 ? '' : 'used'}" data-item="${k}"><div class="art">${itemFront(k)}</div><div class="price">${av > 0 ? 'Zieh mich rein!' : 'wohnt hier'}</div></div>`;
        return `<div class="itemcard" data-item="${k}"><div class="art">${itemFront(k)}</div><div class="price">${av > 0 ? 'Deins' : `${gem(18)}${it.price}`}</div>${av > 0 ? `<span class="have">${av}</span>` : ''}</div>`;
      }
      function shelf(){
        const box = el.querySelector('[data-shelf]'), sl = box.scrollLeft;
        box.innerHTML = (tab === 'moebel' ? ITEM_ORDER : PET_ORDER).map(cardHTML).join('');
        box.scrollLeft = sl; bindCards();
      }
      function buy(k){
        const it = ITEMS[k], can = App.p.gems >= it.price;
        const b = document.createElement('div'); b.className = 'buy-wrap';
        b.innerHTML = `<div class="panel buy"><div class="art">${itemFront(k)}</div>
          <p>${can ? `${it.name} für ${it.price} Glitzersteine kaufen?` : `Für ${it.name} brauchst du noch ${it.price - App.p.gems} Glitzersteine.`}</p>
          ${can ? '' : '<p style="font-size:20px;font-weight:600;color:var(--ink-soft)">Neue Glitzersteine bekommst du im Training und in den Fällen.</p>'}
          <div class="row">${can ? `<button class="btn sec" data-b="no">Lieber nicht</button><button class="btn" data-b="yes">${gem(26)}Kaufen</button>` : `<button class="btn sec" data-b="no">Okay</button><button class="btn mint" data-b="train">${icon('lupe')}Zum Training</button>`}</div></div>`;
        el.querySelector('.ui').appendChild(b);
        b.addEventListener('click', e => {
          const a = e.target.closest('[data-b]')?.dataset.b; if (!a){ if (e.target === b) b.remove(); return; }
          b.remove();
          if (a === 'train') return App.show(TaskScreen(trainingSession(5)));
          if (a === 'yes'){
            App.p.gems -= it.price; hq.owned[k] = (hq.owned[k] || 0) + 1; App.save(); gemsNow(); Sound.reward();
            const sp = hqFreeSpot(hq), [fx, fy] = toXY(sp); place(k, fx, fy);
            toast('Gekauft! Zieh es an seinen Platz.');
          }
        });
      }
      function bindCards(){
        el.querySelectorAll('.itemcard').forEach(card => {
          let g = null; const k = card.dataset.item;
          card.addEventListener('pointerdown', e => {
            if (card.classList.contains('locked')){ card.classList.remove('wiggle'); void card.offsetWidth; card.classList.add('wiggle'); Sound.no(); toast(ITEMS[k].pet ? `Kommt nach Fall ${unlockCase(k).nr}` : `Gibt es nach Fall ${unlockCase(k).nr}`); return; }
            const [x, y] = App.pt(e); g = { id: e.pointerId, sx: x, sy: y, moved: false, el: null, avail: hqAvail(hq, k) > 0 };
            if (g.avail){ e.preventDefault(); try { card.setPointerCapture(e.pointerId); } catch (_){} }
          });
          card.addEventListener('pointermove', e => {
            if (!g || e.pointerId !== g.id || !g.avail) return; const [x, y] = App.pt(e);
            if (!g.moved && Math.hypot(x - g.sx, y - g.sy) > 12 && Math.abs(y - g.sy) > Math.abs(x - g.sx) * .7){
              g.moved = true; disarm(); closeMenu(); const it = ITEMS[k];
              g.el = document.createElement('div'); g.el.className = 'ghost'; g.el.innerHTML = itemFront(k);
              g.w = it.w * .95; g.h = it.h * .95; g.el.style.width = g.w + 'px'; g.el.style.height = g.h + 'px';
              el.querySelector('.ui').appendChild(g.el); Sound.tap();
            }
            if (g.moved){ g.el.style.left = (x - g.w / 2) + 'px'; g.el.style.top = (y - g.h + 30) + 'px'; }
          });
          const up = e => {
            if (!g || e.pointerId !== g.id) return; const d = g; g = null;
            if (!d.moved){
              if (Math.hypot(...App.pt(e).map((v, i) => v - [d.sx, d.sy][i])) > 14) return; // war ein Wischen im Regal
              if (!d.avail){ if (ITEMS[k].pet){ toast('Wohnt schon im Zimmer'); return; } return buy(k); }
              if (armed === card) disarm(); else { disarm(); armed = card; card.classList.add('armed'); toast('Tippe jetzt ins Zimmer'); }
              return;
            }
            const [x, y] = App.pt(e); d.el.remove();
            if (y + 30 < FL.bar) place(k, x, y + 30);
          };
          card.addEventListener('pointerup', up); card.addEventListener('pointercancel', e => { if (g && g.el) g.el.remove(); g = null; });
        });
      }
      el.querySelectorAll('[data-tab]').forEach(t => t.onclick = () => { tab = t.dataset.tab; disarm(); el.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === t)); shelf(); });
      shelf();
      el.querySelectorAll('[data-act="map"]').forEach(b => b.onclick = () => App.show(MapScreen({ focus: 'hq' })));
    }
  };
}
